name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel previous run when a new push arrives in the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Lint & Format
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Mypy
        run: uv run mypy

  docs:
    name: Docs build
    # Pinned like the other jobs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install docs dependencies
        run: uv sync --frozen --only-group docs

      # Strict and WITHOUT -q: with -q the warnings are not counted, and a link
      # to a missing anchor or page passes silently (verified). The site is
      # public and publishes itself on every merge to main, so a broken link
      # must stop here.
      - name: Build the site (strict)
        run: uv run --no-sync mkdocs build --strict -d "$RUNNER_TEMP/site"

      # The published site promises that it asks no third-party server for fonts
      # or scripts. The theme and the diagram plugin load from Google Fonts and
      # unpkg.com by default; fail if a built page or stylesheet names one of
      # those hosts again. The theme's own JavaScript bundle holds fallback
      # addresses that a browser check shows are never requested, so it is not
      # scanned.
      - name: No third-party hosts in the built site
        run: |
          if grep -rIn -E 'fonts\.googleapis\.com|fonts\.gstatic\.com|unpkg\.com|cdn\.jsdelivr\.net' \
              --include='*.html' --include='*.css' "$RUNNER_TEMP/site"; then
            echo '::error::The built site names a third-party host (see the lines above).'
            exit 1
          fi

  test:
    name: Tests
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      # The requires_ffmpeg tests run here, as in the local full gate.
      # The runner's apt mirror list puts azure.archive.ubuntu.com first; on
      # 2026-11-11 it did not resolve and this step hung ~50 minutes until it
      # was cancelled. Drop that mirror, and bound the step so it fails fast.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 ffmpeg

      # Local test values only (no secrets): read by the app settings and by
      # docker compose for the services below.
      - name: Create .env
        run: cp .env.example .env

      # Same images, settings and health checks as the local gate, from one file.
      - name: Start Postgres, Redis and SeaweedFS
        run: docker compose up -d --wait postgres redis seaweedfs

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --run-db --run-redis --tb=short -q -rfEs
        env:
          ENVIRONMENT: testing
          TEST_REDIS_DB: "15"


  ai-review:
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: KonstZiv/ai-code-reviewer@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mistral_api_key: ${{ secrets.AI_REVIEWER_MISTRAL_API_KEY }}
          google_api_key: ${{ secrets.AI_REVIEWER_GOOGLE_API_KEY }}
          llm_provider: ${{ vars.LLM_PROVIDER || 'mistral' }}
          llm_fallback_provider: ${{ vars.LLM_FALLBACK_PROVIDER || 'google' }}
          mistral_model: ${{ vars.MISTRAL_MODEL || 'mistral-large-latest' }}
          mistral_api_url: ${{ vars.MISTRAL_API_URL || '' }}
