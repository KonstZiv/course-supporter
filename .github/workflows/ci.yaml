name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, task/ci-docs-filter ]

# Cancel previous run when a new push arrives in the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  changes:
    name: Detect changes
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if changes are docs-only
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          docs_only=false

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is $EVENT_NAME (not pull_request); running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            git fetch origin "${BASE_REF}" || true
          fi

          changed=$(git -c core.quotePath=false diff --no-renames --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null)
          diff_rc=$?

          if [ $diff_rc -ne 0 ] || [ -z "$changed" ]; then
            echo "git diff failed ($diff_rc) or empty diff; running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_docs=true
          file_count=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            file_count=$((file_count + 1))
            case "$file" in
              docs/*|mkdocs.yml) ;;
              */*)
                is_docs=false
                break
                ;;
              *.md) ;;
              *)
                is_docs=false
                break
                ;;
            esac
          done <<< "$changed"

          if [ "$file_count" -gt 0 ] && [ "$is_docs" = "true" ]; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "Changed files:"
          echo "$changed"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & Format
    needs: changes
    if: ${{ !cancelled() }}
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - uses: astral-sh/setup-uv@v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: uv sync --frozen --group dev

      - name: Ruff check
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run ruff format --check src/ tests/

      - name: Skip notice (docs-only PR)
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Docs-only PR: skipping lint & format checks."

  typecheck:
    name: Type Check
    needs: changes
    if: ${{ !cancelled() }}
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - uses: astral-sh/setup-uv@v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: uv sync --frozen --group dev

      - name: Mypy
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run mypy

      - name: Skip notice (docs-only PR)
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Docs-only PR: skipping type checks."

  docs:
    name: Docs build
    # Pinned like the other jobs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install docs dependencies
        run: uv sync --frozen --only-group docs

      # Strict and WITHOUT -q: with -q the warnings are not counted, and a link
      # to a missing anchor or page passes silently (verified). The site is
      # public and publishes itself on every merge to main, so a broken link
      # must stop here.
      - name: Build the site (strict)
        run: uv run --no-sync mkdocs build --strict -d "$RUNNER_TEMP/site"

      # The published site promises that it asks no third-party server for fonts
      # or scripts. The theme and the diagram plugin load from Google Fonts and
      # unpkg.com by default; fail if a built page or stylesheet names one of
      # those hosts again. The theme's own JavaScript bundle holds fallback
      # addresses that a browser check shows are never requested, so it is not
      # scanned.
      - name: No third-party hosts in the built site
        run: |
          if grep -rIn -E 'fonts\.googleapis\.com|fonts\.gstatic\.com|unpkg\.com|cdn\.jsdelivr\.net' \
              --include='*.html' --include='*.css' "$RUNNER_TEMP/site"; then
            echo '::error::The built site names a third-party host (see the lines above).'
            exit 1
          fi

  test:
    name: Tests
    needs: changes
    if: ${{ !cancelled() }}
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    env:
      # ffmpeg is a pinned static build, not apt: on 2026-11-11 the runner could
      # not resolve the Ubuntu archive hosts and the apt install hung ~50
      # minutes. 7.1.5 is the version prod gets from Debian trixie
      # (python:3.13-slim). The build is the last one of July 2026 from
      # FFmpeg-Builds/FFmpeg-Builds (formerly BtbN/FFmpeg-Builds), which keeps
      # the last build of each month for two years; the sum is the one in that
      # release's checksums.sha256.
      FFMPEG_RELEASE: autobuild-2026-07-31-14-10
      FFMPEG_ASSET: ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz
      FFMPEG_SHA256: c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'

      - uses: astral-sh/setup-uv@v5
        if: needs.changes.outputs.docs_only != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: uv sync --frozen --group dev

      # The requires_ffmpeg tests run here, as in the local full gate. Without
      # ffmpeg/ffprobe on PATH they are skipped, not failed (tests/conftest.py),
      # so the step checks both binaries before it adds them to PATH.
      - name: Cache the ffmpeg archive
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-archive
          key: ffmpeg-${{ env.FFMPEG_ASSET }}-${{ env.FFMPEG_SHA256 }}

      - name: Install ffmpeg
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 8
        shell: bash
        run: |
          archive="$HOME/.cache/ffmpeg-archive/$FFMPEG_ASSET"
          if [ -f "$archive" ]; then
            echo "Archive restored from the cache."
          else
            mkdir -p "$(dirname "$archive")"
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_ASSET"
          fi
          echo "$FFMPEG_SHA256  $archive" | sha256sum -c -
          dest="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$dest"
          tar -xJf "$archive" -C "$dest" --strip-components=1
          "$dest/bin/ffmpeg" -version | sed -n 1p
          "$dest/bin/ffprobe" -version | sed -n 1p
          echo "$dest/bin" >> "$GITHUB_PATH"

      # Local test values only (no secrets): read by the app settings and by
      # docker compose for the services below.
      - name: Create .env
        if: needs.changes.outputs.docs_only != 'true'
        run: cp .env.example .env

      # Same images, settings and health checks as the local gate, from one file.
      - name: Start Postgres, Redis and SeaweedFS
        if: needs.changes.outputs.docs_only != 'true'
        run: docker compose up -d --wait postgres redis seaweedfs

      - name: Apply migrations
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run alembic upgrade head

      - name: Run tests
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run pytest --run-db --run-redis --tb=short -q -rfEs
        env:
          ENVIRONMENT: testing
          TEST_REDIS_DB: "15"

      - name: Skip notice (docs-only PR)
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Docs-only PR: skipping test execution and service spin-up."


  ai-review:
    # Pinned: libmagic 5.46 on ubuntu-26.04 does not detect a zip read from memory; prod pins libmagic in Dockerfile; unpin only with a libmagic >= 5.47 check.
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: KonstZiv/ai-code-reviewer@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mistral_api_key: ${{ secrets.AI_REVIEWER_MISTRAL_API_KEY }}
          google_api_key: ${{ secrets.AI_REVIEWER_GOOGLE_API_KEY }}
          llm_provider: ${{ vars.LLM_PROVIDER || 'mistral' }}
          llm_fallback_provider: ${{ vars.LLM_FALLBACK_PROVIDER || 'google' }}
          mistral_model: ${{ vars.MISTRAL_MODEL || 'mistral-large-latest' }}
          mistral_api_url: ${{ vars.MISTRAL_API_URL || '' }}
