name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/course-supporter

            echo "=== Pull latest ==="
            git pull origin main

            echo "=== Build ==="
            docker compose --env-file .env.prod -f docker-compose.prod.yaml build app worker

            echo "=== Migrations (before app start) ==="
            docker compose --env-file .env.prod -f docker-compose.prod.yaml run --rm -T app \
                python -m alembic upgrade head

            echo "=== Deploy ==="
            docker compose --env-file .env.prod -f docker-compose.prod.yaml up -d

            echo "=== Health check (via Docker health status) ==="
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' course-supporter-app 2>/dev/null || echo "unknown")
              if [ "$status" = "healthy" ]; then
                echo "Application is healthy."
                break
              fi
              echo "Waiting for healthy status... ($i/30) current=$status"
              sleep 5
              if [ "$i" -eq 30 ]; then
                echo "Health check failed after 30 retries." >&2
                docker compose --env-file .env.prod -f docker-compose.prod.yaml logs app --tail 30
                exit 1
              fi
            done

            echo "=== Cleanup ==="
            docker image prune -af --filter "until=24h"
            docker builder prune -af --filter "until=24h"

            echo "=== Deploy complete: $(date) ==="

      - name: Smoke test
        env:
          SMOKE_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
        if: env.SMOKE_KEY != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/course-supporter
            ./scripts/smoke_test.sh \
                https://api.pythoncourse.me \
                ${{ secrets.SMOKE_TEST_API_KEY }}
