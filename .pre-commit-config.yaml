repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Local, not mirrors-mypy: the hook runs mypy in the project's own uv
  # environment, the one `make typecheck` and CI use, so there is no
  # separate venv whose package versions can drift from uv.lock. The
  # directories come from `[tool.mypy] files` in pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Byte-exact fixtures: these files are the bytes a real upload
      # carried, and the tests assert their sha256. Appending a newline or
      # trimming a trailing space would make them fixtures of something
      # nobody ever submitted -- end-of-file-fixer did exactly that on the
      # first commit attempt.
      - id: trailing-whitespace
        exclude: '^tests/fixtures/security/encodings/'
      - id: end-of-file-fixer
        exclude: '^tests/fixtures/security/encodings/'
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: '^tests/fixtures/(audio|presentations)/'
      - id: debug-statements
