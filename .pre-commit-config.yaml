repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        # Pinned to uv.lock: unpinned, this venv takes the newest releases
        # (SQLAlchemy 2.1, openai 3, ...) and reports errors `uv run mypy` --
        # CI's run -- does not. Move a pin together with its lock entry.
        additional_dependencies:
          - pydantic==2.12.5
          - pydantic-settings==2.12.0
          - sqlalchemy[asyncio]==2.0.46
          - pgvector==0.4.2
          - uuid-utils==0.14.0
          - beautifulsoup4==4.14.3
          - structlog==25.5.0
          - google-genai==1.62.0
          - anthropic==0.79.0
          - openai==2.20.0
          - types-PyYAML==6.0.12.20250915
          - pyyaml==6.0.3
          - fastapi==0.128.7
          - arq==0.27.0
          - jinja2==3.1.6
          - python-magic==0.4.27
          - pytest==9.0.2
          - pillow==12.1.0
          - argon2-cffi==25.1.0
          - pyjwt==2.11.0
          - aiosmtplib==5.1.2
          - httpx==0.28.1
          - alembic==1.18.4
          - numpy==2.3.5
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        entry: mypy

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Byte-exact fixtures: these files are the bytes a real upload
      # carried, and the tests assert their sha256. Appending a newline or
      # trimming a trailing space would make them fixtures of something
      # nobody ever submitted -- end-of-file-fixer did exactly that on the
      # first commit attempt.
      - id: trailing-whitespace
        exclude: '^tests/fixtures/security/encodings/'
      - id: end-of-file-fixer
        exclude: '^tests/fixtures/security/encodings/'
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: '^tests/fixtures/(audio|presentations)/'
      - id: debug-statements
