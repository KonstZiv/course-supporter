# The catalog of packages of units (BIL-PAY). Shape and checks:
# src/course_supporter/billing/payments/catalog.py. Read once per process.
#
# A package: its id, its units (a whole number), its price in minor units
# (cents) per currency — EUR always, others where set — whether it is on
# sale (active) and, optionally, its tax_mode (inclusive: the tax is in the
# price; exclusive: the tax is added on top — as the product is set up at the
# merchant of record). The units of a purchase are read from here when the provider
# says it was paid, so an id stands for its units and prices for good: to
# change a package, give it a new id.
#
# Активні пакети — ті, що на сторінці цін, а id товарів посередника —
# тестового режиму в providers і бойового в providers_live.

packages:
  # Ціни й розміри — як на сторінці цін сайту (рішення оператора 2026-11-15);
  # id товарів Creem — у providers (тестовий режим) і providers_live (бойовий).
  - id: units-500-v1
    units: 500
    prices_minor:
      EUR: 999
    active: true
    # Рішення оператора 2026-11-20: податок додається зверху (налаштування товару в Creem).
    tax_mode: exclusive
  - id: units-1500-v1
    units: 1500
    prices_minor:
      EUR: 1499
    active: true
    # Рішення оператора 2026-11-20: податок додається зверху (налаштування товару в Creem).
    tax_mode: exclusive
  - id: units-5000-v1
    units: 5000
    prices_minor:
      EUR: 3999
    active: true
    # Рішення оператора 2026-11-20: податок додається зверху (налаштування товару в Creem).
    tax_mode: exclusive
  - id: units-10000-v1
    units: 10000
    prices_minor:
      EUR: 6999
    active: true
    # Рішення оператора 2026-11-20: податок додається зверху (налаштування товару в Creem).
    tax_mode: exclusive

  # SANDBOX ONLY, not on sale since 2026-11-15; remove before switching Creem to live mode
  - id: sandbox-test-500
    units: 500
    prices_minor:
      EUR: 500
    active: false

# A section per provider (its adapter's name, as in BILLING_PROVIDERS):
# package id -> the provider's id of the product or price its checkout needs.
# An empty section is allowed. Two tables, by the adapter's mode (test_mode):
# providers in test mode, providers_live in live mode — a checkout reads only
# the table of its mode, never the other.
providers:
  # Creem product ids (prod_...), one product per package, from the Creem
  # dashboard — of the test mode while CREEM_API_BASE is the test host (a test
  # product is unknown to the live API). Without an id the package cannot be
  # bought through Creem (503).
  creem:
    units-500-v1: prod_IjKGKARYgwR25ktF0By1A
    units-1500-v1: prod_7MjqlyfEXv7zVO37m0vCjN
    units-5000-v1: prod_5DTm2EO5XM9Rbm53bRKVps
    units-10000-v1: prod_2u00d6l8qzsfhjeaDTl6FL
    sandbox-test-500: prod_2oJ3Yqnf53wOrikCrQGDtk

# The same in the provider's LIVE mode (operator 2026-11-18). Creem: read
# while CREEM_API_BASE is the live host, https://api.creem.io/v1 (the adapter's
# test_mode is False); live product ids (prod_...) from the Creem dashboard
# outside Test Mode. A package without an id here is not sold in live mode
# (503) — its test id is never sent to the live API. sandbox-test-500 never
# goes here.
providers_live:
  # Ідентифікатори бойового кабінету Creem, створені 2026-11-18; пакети й ціни —
  # ті самі, що в каталозі.
  creem:
    units-500-v1: prod_641KyNDG0h2IN0GPNJ7zKT
    units-1500-v1: prod_6JbFesPKLrkcURhHH8F3sk
    units-5000-v1: prod_5t0ORZST2Hw4ZqW8hV5qC7
    units-10000-v1: prod_1TE2jSDw0OcglA1TY0TC1O
