# Shadow price estimates of actions (BIL-D). Shape and checks:
# src/course_supporter/cost_estimate/settings.py. Read once per process.
#
# An estimate prices every step of an action once, on the first rung of its
# ladder the input fits by the router's input_budget_ratio rule, at the catalog
# prices (config/external_services.yaml) — fallback rungs are not in E. What it
# cannot read from the material it takes from here.
#
# Every number below is "не калібровано" (calibrated: false) and names its
# source. The calibration report (scripts/cost_estimate_report.py) compares
# the estimates with the call register; a measured median replaces a number
# here, one step per line, and its line gets calibrated: true.
#
# Prompt sizes "measured": the characters of the step's prompt_ref file
# (2026-11-02) at the router's 3.5 characters a token
# (llm/token_budget.py) — the template only, before anything is put in it.

# ── Operator parameters (ratified) ──
margin: 0.20          # P = E x (1 + margin)
# K, units per 1 USD of cost (operator 2026-11-15, variant C of the
# K-decision table): the median fact of a `task` review on the new path,
# $0.109 over 17 reviews on production (read 2026-11-15) x 900 = 98.5 ≈ 100
# units charged for a typical review, as the pricing page says. P (with the
# margin) and the reserve follow from E; E is to be calibrated before
# charging is switched on (DD-BIL-CAL).
units_per_usd: 900
guard_minutes: 15     # a peak that starts within this many minutes prices as peak

# ── The typical size of a student's work (BIL-E) ──
# The price shown before a submission without its file (basis "typical") and
# the student's reminders without history use it when the task has no earlier
# review estimates to take the median size of. No median is measured yet: the
# start is an upper bound — the largest submission seen in the stage-2
# calibration (READING-2026-11-07.md: 3 025 tokens of work beside the prompt in
# the largest observed input of safety / attempt_classifier /
# criteria_evaluation) at the router's 3.5 characters a token
# (llm/token_budget.py): 3 025 x 3.5 = 10 587.5, rounded up to 10 600.
# Replace with the median of `inputs.submission_chars` of review estimates.
typical_submission: {chars: 10600, calibrated: false}

# ── Review on the new path: stages of config/submission_paths.yaml ──
# input = submission text + prompt_tokens; output = output_tokens per call;
# calls = expected calls of the stage per submission.
#
# Only the model stages of a path are priced: homework/path_runner.py:326-335
# hands the estimate model_stages(config) (homework/path_config.py:508) and
# the path's stages among them. A code stage calls no model and has no line
# here — `course_link_lookup` (config/submission_paths.yaml:165-166, K5: the
# concept finder over the database, homework/course_links.py) adds 0 to E,
# and that is right. A path without stages — `test` — gives E = 0.
review:
  # калібрування етап 2, 2026-11-07: max спостережена підказка (5509 - 3025) 2484 × 1,25, READING-2026-11-07.md
  # калібрування етап 2, 2026-11-07: max спостережене 52 × 1,25, READING-2026-11-07.md
  safety:             {prompt_tokens: 3105, output_tokens: 65, calibrated: true}
  # калібрування етап 2, 2026-11-07: max спостережена підказка (4955 - 3025) 1930 × 1,25, READING-2026-11-07.md
  # калібрування етап 2, 2026-11-07: max спостережене 96 × 1,25, READING-2026-11-07.md
  attempt_classifier: {prompt_tokens: 2413, output_tokens: 120, calibrated: true}
  # калібрування етап 2, 2026-11-07: max спостережена підказка (6921 - 3025) 3896 × 1,25, READING-2026-11-07.md
  # калібрування етап 2, 2026-11-07: max спостережене 6838 × 1,25, READING-2026-11-07.md
  # calls: 2 — наживо у 5 із 5 дій task стадія робить два запити (READING-2026-11-07.md)
  criteria_evaluation: {prompt_tokens: 4870, output_tokens: 8548, calls: 2, calibrated: true}
  # калібрування етап 2, 2026-11-07: max спостережена підказка (8672 - 353) 8319 × 1,25, READING-2026-11-07.md
  # калібрування етап 2, 2026-11-07: max спостережене 6780 × 1,25, READING-2026-11-07.md
  # найгірший випадок — <course_links> для всіх незарахованих критеріїв ≈ 16 861 токен понад підказку (≈ 39 590 разом);
  # у спостережених даних такого випадку не було, калібрування його не покриває.
  review_explanation: {prompt_tokens: 10399, output_tokens: 8475, calls: 1, calibrated: true}

  # Stages of the `project` path (config/submission_paths.yaml:
  # project_criteria_evaluation, project_review_explanation — on every path of
  # `project` since project chain K8, in test mode, after safety and
  # attempt_classifier, both priced above). No live measurement exists yet:
  # each line is its twin's calibrated line plus the characters its own prompt
  # adds over the twin's at 3.5 characters a token (2026-11-15). Replace with a
  # measured median after the live measurement of K8.
  # prompts/criteria_evaluation_project/v1.md 8366 chars - prompts/criteria_evaluation/v1.md 4446 = 3920 chars = 1120 tokens: 4870 + 1120
  project_criteria_evaluation: {prompt_tokens: 5990, output_tokens: 8548, calls: 2, calibrated: false}
  # prompts/review_explanation_project/v1.md 10633 chars - prompts/review_explanation/v3.md 9182 = 1451 chars = 414 tokens: 10399 + 414
  project_review_explanation: {prompt_tokens: 10813, output_tokens: 8475, calls: 1, calibrated: false}

  # Stages of the path with the student's replies (task 12a, K4:
  # criteria_evaluation_with_replies, review_explanation_with_replies on the
  # `repeat_with_replies` path of `task` and `short_task`, which no submission
  # state selects before K3). No live measurement yet — 12a measures on
  # 2026-11-18: each line is its twin's calibrated line plus the characters its
  # own prompt adds over the twin's at 3.5 characters a token (2026-11-16), as
  # the project's lines above. The replies themselves (up to 12 000 characters
  # shown to the evaluation, 24 000 of threads to the explanation,
  # homework/student_replies.py) and the answers to them are not counted: the
  # live measurement gives their size.
  # prompts/criteria_evaluation/v1_with_replies.md 5975 chars - prompts/criteria_evaluation/v1.md 4446 = 1529 chars = 437 tokens: 4870 + 437
  criteria_evaluation_with_replies: {prompt_tokens: 5307, output_tokens: 8548, calls: 2, calibrated: false}
  # prompts/review_explanation/v3_with_replies.md 13315 chars - prompts/review_explanation/v3.md 9182 = 4133 chars = 1181 tokens: 10399 + 1181
  review_explanation_with_replies: {prompt_tokens: 11580, output_tokens: 8475, calls: 1, calibrated: false}

# ── Task preparation: input = the task document + prompt_tokens ──
task_preparation:
  # калібрування етап 2, 2026-11-07: підказка max 10254 × 1,25, READING-2026-11-07.md
  # робота 894 = 2 602 (вхід рядка оцінки) − 1 708 (підказка в config на 74eaf29)
  # калібрування етап 2, 2026-11-07: max спостережене 9230 × 1,25, READING-2026-11-07.md
  criteria_decomposition: {prompt_tokens: 12818, output_tokens: 11538, calibrated: true}
  # prompt: prompts/key_explanation/v2.md, measured. output: no measured
  # number (ladders_mentor.yaml: "NOT CALIBRATED") — rung-1 pin 32768, стеля.
  key_explanation: {prompt_tokens: 1059, output_tokens: 32768, calibrated: false}

# ── Processing of an author's material (one job) ──
processing:
  speech:
    # tests/fixtures/audio/scribe_v1_ukrainian_124min.json (124.32 min):
    # 13 703 words -> 110.2 words a minute; its text 81 809 chars -> 5.97 a
    # word. Pass 2a input as the code builds it (audio.py, steps.py
    # `words_json`, spacing entries included): audio 2 159 826 chars -> 157.6 a
    # word; video (no logprob) 1 262 647 chars -> 92.1 a word.
    words_per_minute: 110.2
    chars_per_word: 5.97
    audio_2a_chars_per_word: 157.6
    video_2a_chars_per_word: 92.1
    calibrated: false
  video:
    # ladders_video.yaml video_pass_2a_mapping comment: a 10:48 video with 241
    # visual scenes -> 22.3 a minute.
    frames_per_minute: 22.3
    # ingestion/video_pipeline/vision.py `_IMAGE_BUDGET` = 12 images a chunk.
    frames_per_vision_call: 12
    calibrated: false
  denoise:
    # Pass 2c runs once per segment Pass 2a marks noisy. Segment length:
    # ladders_audio.yaml audio_pass_2c_denoise comment, "one segment's cleaned
    # transcript (~15 min ≈ 3.5k tokens)". Noisy share: no number in code or
    # fixtures — 0.5 (operator, BIL-D).
    minutes_per_segment: 15
    noisy_share: 0.5
    calibrated: false
  node_summary:
    # Regeneration of node summaries (job node_summary_regeneration). A child
    # that has no compressed_summary yet is read at the top of what the
    # bottom-up prompt asks for: prompts/methodist_bottomup/v3.md, "1000-2000
    # chars (NOT tokens)" -> 2000. A child that has one is read at its length.
    child_summary_chars: 2000
    calibrated: false
  code:
    # code_skeleton_extraction calls the model only for a file that is not
    # verbatim, not Python with a clean parse, not a known family — decided per
    # file after the estimate's point; no number — 0.5 (operator, BIL-D).
    llm_skeleton_share: 0.5
    calibrated: false
  steps:
    # prompts/safety_check_authored/v1.md, measured; output стеля (registry
    # max of mistral-small-latest, 8192 — the rung has no pin).
    safety_check_authored:        {prompt_tokens: 2101, output_tokens: 8192, calibrated: false}
    # prompt measured; output стеля (gemini-3.1-flash-lite registry max).
    audio_pass_2a_mapping:        {prompt_tokens: 5456, output_tokens: 65536, calibrated: false}
    # prompt measured; output 3500 — ladders_audio.yaml (~15 min ≈ 3.5k tokens).
    audio_pass_2c_denoise:        {prompt_tokens: 1132, output_tokens: 3500, calibrated: false}
    # prompt measured + 6144 image tokens a chunk (vision.py `_BUDGET_TOKENS`);
    # output: rung-1 pin 8192, стеля.
    video_pass_1_vision:          {prompt_tokens: 6583, output_tokens: 8192, calibrated: false}
    # prompt measured; output 21000 — ladders_video.yaml: 21k reasoning tokens
    # of the balanced run (the answer itself is not measured).
    video_pass_2a_mapping:        {prompt_tokens: 3883, output_tokens: 21000, calibrated: false}
    # prompt measured; output 3500 — ladders_video.yaml (3.5k per ~15 min).
    video_pass_2c_denoise:        {prompt_tokens: 1222, output_tokens: 3500, calibrated: false}
    # prompt measured + 2500 image tokens a slide (presentation.py: 1.1-2.5k
    # a slide, upper end); output стеля (qwen3.5-flash registry max).
    presentation_pass_1_vision:   {prompt_tokens: 2744, output_tokens: 65536, calibrated: false}
    # prompt measured; output стеля (mistral-large-2512 registry max).
    presentation_pass_2a_mapping: {prompt_tokens: 3152, output_tokens: 8192, calibrated: false}
    # prompt measured; output 1800 — ladders_pipeline.yaml (~1.8k output
    # tokens for a 10k-char text).
    pass_2a_mapping:              {prompt_tokens: 4076, output_tokens: 1800, calibrated: false}
    # prompts measured; outputs: rung-1 pins, стеля.
    code_skeleton_extraction:     {prompt_tokens: 610, output_tokens: 8192, calibrated: false}
    code_segment_description:     {prompt_tokens: 563, output_tokens: 4096, calibrated: false}
    code_summary:                 {prompt_tokens: 359, output_tokens: 8192, calibrated: false}
    # Regeneration of node summaries (BIL: node_summary_regeneration). No
    # measured run exists in this repository's data; both lines are upper
    # bounds with their reasons. prompt measured: prompts/methodist_bottomup/v3.md
    # 18 728 chars / 3.5 = 5 350 tokens; the material (own documents in full
    # within the 200 000-char budget, the others as summaries, the children's
    # summaries) is added per node by the estimate. output 32768 — the stage
    # ceiling on both rungs (ladders_methodist.yaml): a real lesson node
    # (~21k chars in) already filled 16384 on the first rung and the JSON was
    # cut, so the typical answer is above 16k and the ceiling is the safe upper
    # bound until a median is measured.
    methodist_bottomup:           {prompt_tokens: 5350, output_tokens: 32768, calibrated: false}
    # prompt measured: prompts/methodist_topdown/v2.md 6 390 chars / 3.5 = 1 825
    # tokens, plus this node's own canonical state and six fields of the
    # parent's: "~3-8k chars" (ladders_methodist.yaml, spike §3), upper end 8 000
    # chars = 2 285 tokens -> 4 110. output 4734 = 3787 x 1.25: the largest of the
    # three spike outputs, reasoning included (ladders_methodist.yaml:
    # "1878 / 3787 / 1203 tokens"), by the margin the other lines use.
    methodist_topdown:            {prompt_tokens: 4110, output_tokens: 4734, calibrated: false}
