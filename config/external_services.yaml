        # dead ModelRouter chains, fate decided by the DD-20-A dismantle task.
        capabilities: [vision, structured_output]
        max_context: 131072
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.00015
        cost_per_1k_out: 0.0006

