        # access only to the canonical alias; the date-pinned id returns 403
        # Model.AccessDenied (separate unauthorized entity, lower limits).
        # Mirrors the VL alias precedent (qwen3-vl-32b-instruct).
        # Workspace scope Global; Global pricing tab, console eu-central-1,
        # verified 2026-07-26: $1.65/$4.951 per 1M is the list rate (flat).
        # Earlier registry held $2.50/$7.50 as the presumed durable rate
