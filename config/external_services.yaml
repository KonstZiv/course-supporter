        capabilities: [vision, structured_output, long_context]
        max_context: 128000
        max_output_tokens: 16384
        unit_type: tokens
        cost_per_1k_in: 0.0025
        cost_per_1k_out: 0.01

  deepseek:
    type: llm
    # Live IDs verified 2026-05-23 (api.deepseek.com/models): the lineup is now
    # deepseek-v4-flash + deepseek-v4-pro. deepseek-chat / deepseek-reasoner are
    # being deprecated by DeepSeek (they map to the non-thinking / thinking
    # modes of deepseek-v4-flash). Pricing per api-docs.deepseek.com/pricing.
    models:
      - id: deepseek-v4-flash
        # Current flash tier (replaces deepseek-chat). Referenced by the
        # safety_check / safety_check_authored / pass_2a_mapping ladders —
        # registered 2026-05-23 to close their cost-tracking gap. $0.14/$0.28
        # per 1M (rates re-verified 2026-07-26 against api-docs.deepseek.com,
        # Models & Pricing). Context 1M / max output 384K per api-docs.deepseek.com
        # ("MAX OUTPUT | MAXIMUM: 384K"), verified 2026-07-19 with live
        # api.deepseek.com calls (max_tokens 16384/65536/384000 all HTTP 200;
        # the V3-era [1, 8192] wall does not apply here). 384000 is the
        # provider's published output maximum; stages needing a tighter cap
        # pin it on the rung — the three classifier rungs in
        # ladders_mentor.yaml pin 8192.
        capabilities: [structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 384000
        unit_type: tokens
        cost_per_1k_in: 0.00014
        cost_per_1k_out: 0.00028
      - id: deepseek-v4-pro
        # "Smart" / deep-reasoning tier. $0.435/$0.87 per 1M — verified
        # 2026-07-26 against DeepSeek official pricing (api-docs.deepseek.com,
        # Models & Pricing): the prior 75% promo
        # became the permanent list rate after the old $1.74/$3.48 durable
        # rate was retired 2026-05-31, so promo and durable now coincide
        # (supersedes the earlier "keep durable, ignore promo" note). Context
        # 1M / max output 384K per the official DeepSeek docs verified 2026-06-05;
        # the conservative ``max_output_tokens`` here (65536) mirrors the video
        # Pass 2a ladder pin — the model's true output ceiling is far higher,
        # but the cap above which we have empirical evidence of clean emission
        # is the spike's observed ~23k token thinking-on output (RUN_SMOKE #2,
        # B-spike series). Raise as new stages exercise more output.
        # Reasoning-mode behaviour: per KD-2.4-T this model is routed via the
        # ``deepseek_thinking`` provider for reasoning-tier stages (video Pass
        # 2a) so the thinking-on default is preserved; the ``deepseek`` provider
        # (KD-2.4-S) still applies thinking-disabled for schema-bound consumers
        # and can be used with this model when that contract is required.
        capabilities: [structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        cost_per_1k_in: 0.000435
        cost_per_1k_out: 0.00087
      - id: deepseek-chat
        # DeepSeek shuts this model off 2026-07-24 15:59 UTC
        # (api-docs.deepseek.com, verified 2026-07-19); it maps to
        # deepseek-v4-flash non-thinking. This record stays only because the
        # dead `actions` chains below reference it and the startup validator
        # (registry.py, validate_and_flatten) resolves those chains against our
        # own registry, not the provider — so after the shutdown date startup
        # still passes and no live stage changes behaviour (the live surface is
        # ladders_*.yaml / StageRouter, which never names deepseek-chat).
        # Removal tracked as DD-20-A.
        capabilities: [structured_output]
        max_context: 131072
        # On 2026-04-13 deepseek-chat rejected max_tokens=16384 with HTTP 400
        # ('Invalid max_tokens value, the valid range of max_tokens is
        # [1, 8192]') — an incorrect bump that failed every material_outline
        # call; the 8192 below is recorded from that observation. Since
        # deepseek-chat now maps to v4-flash non-thinking (which accepts up to
        # 384000 on input), its current ceiling has not been re-measured. For
        # output beyond 8k the legacy chain fell back to Claude Sonnet — the
        # proper fix is the long-video chunking project.
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.00014
        cost_per_1k_out: 0.00028

  mistral:
    type: llm
    models:
      - id: mistral-large-2512
        # Mistral Large 3. Rates + 256k context per mistral.ai/pricing/api and
        # the official model card (docs.mistral.ai, mistral-large-3-25-12),
        # verified 2026-07-26. Previous $2/$6 was the Large 2 rate.
        # max_output_tokens left at 8192: first-party ceiling is not published
        # (Bedrock's 32K is a different platform).
        capabilities: [structured_output, long_context]
        max_context: 262144
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.0005
        cost_per_1k_out: 0.0015
      - id: mistral-small-latest
        # Alias now resolves to Mistral Small 4; rates per mistral.ai/pricing/api,
