# ============================================================
# Unified external service registry
# ============================================================
# Covers LLM providers, transcription, and future integrations.
# StageRouter (config/ladders_*.yaml) is the live LLM routing surface; this
# registry supplies the model catalog and the STT ``transcribe`` action chain.
#
# ── Periodic revision log (vision-rules#17, 15-day cadence) ──
# 2026-08-28 full sweep: every model/service number below re-verified against
#   live provider pages (prior full sweep 2026-07-26). Changes this sweep:
#   - deepseek-v4-pro / deepseek-v4-flash: DeepSeek moved to peak/off-peak
#     billing + raised list rates effective 2026-08-16 (see per-entry notes).
#     Registry now pins the off-peak (standard, modal) rate; peak = +100%,
#     documented inline. deepseek-v4-pro is the Methodist ladder PRIMARY, so
#     the ratified Methodist-pass estimate must be recomputed on the new rate.
#   - deepgram nova-3: $0.0058 -> $0.0052/min (multilingual pre-recorded PAYG).
#   Notes-only (rate unchanged): gemini-3.6-flash intro discount through
#     2026-12-31; elevenlabs scribe_v1 deprecated -> scribe_v2 (same rate);
#     qwen3-vl-32b-instruct retirement 2026-10-10 (DD-2.4-X) not carried on the
#     live pricing page but the model remains listed + priced.
#   yt-dlp backend lock (separate file, uv.lock) at 2026.8.19 = current latest
#     stable per PyPI + GitHub releases on 2026-08-28 -> no bump needed this
#     sweep (vision-rules#17 downloader item / DD-SP-F).

providers:
  gemini:
    type: llm
    models:
      # Pricing verified 2026-08-28 against ai.google.dev/gemini-api/docs/pricing
      # (paid tier, text input). Registry uses per-1k = per-1M / 1000.
      - id: gemini-3.5-flash
        # Latest Gemini flash (registered 2026-05-23). $1.50 / $9.00 per 1M.
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        cost_per_1k_in: 0.0015
        cost_per_1k_out: 0.009
      - id: gemini-3.1-flash-lite
        # Cost-tier flash — audio Pass 2a/2c primary rung (registered
        # 2026-05-23; was callable but unregistered → no cost-tracking).
        # $0.25 / $1.50 per 1M.
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        cost_per_1k_in: 0.00025
        cost_per_1k_out: 0.0015
      - id: gemini-3-flash-preview
        # Preview model — relief when gemini-2.5-flash is throttled (503).
        # Still Preview (not GA) as of 2026-08-28.
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        # Official rate: $0.50 / $3.00 per 1M.
        cost_per_1k_in: 0.0005
        cost_per_1k_out: 0.003
      - id: gemini-2.5-flash
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        # Corrected 2026-05-23 (was 0.00015 / 0.0006 — a gpt-4o-mini rate that
        # understated output ~4×): official $0.30 / $2.50 per 1M.
        cost_per_1k_in: 0.0003
        cost_per_1k_out: 0.0025
      - id: gemini-2.5-pro
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        # Corrected 2026-05-23 (out was 0.005, understated 2×): official
        # $1.25 / $10.00 per 1M (≤200k-prompt tier). >200k tier is
        # $2.50 / $15.00 per 1M (re-confirmed live 2026-08-28).
        cost_per_1k_in: 0.00125
        cost_per_1k_out: 0.010
      - id: gemini-3.6-flash
        # ai.google.dev/gemini-api/docs/pricing + model page, verified
        # 2026-08-28. $1.50 / $7.50 per 1M is the durable list rate; an
        # introductory discount ($0.75 / $3.75 per 1M) is live through
        # 2026-12-31 and reverts to list on 2027-01-01 — registry pins the
        # durable rate to avoid a self-reverting stamp.
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        cost_per_1k_in: 0.0015
        cost_per_1k_out: 0.0075
      - id: gemini-3.5-flash-lite
        # ai.google.dev/gemini-api/docs/pricing + model page, verified
        # 2026-08-28. Single input rate for text/image/video/audio.
        # $0.30 / $2.50 per 1M.
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        cost_per_1k_in: 0.0003
        cost_per_1k_out: 0.0025

