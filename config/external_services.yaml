  deepseek:
    type: llm
    # Live IDs verified 2026-05-23 (api.deepseek.com/models): the lineup is now
    # deepseek-v4-flash + deepseek-v4-pro. The legacy chat / reasoner aliases
    # were retired by DeepSeek 2026-07-24 (they mapped to the non-thinking /
    # thinking modes of deepseek-v4-flash / v4-pro; retirement re-confirmed
    # 2026-08-28). Pricing per api-docs.deepseek.com/quick_start/pricing.
    models:
      - id: deepseek-v4-flash
        # Current flash tier (replaces the retired chat alias). Referenced by the
        # safety_check / safety_check_authored / pass_2a_mapping ladders —
        # registered 2026-05-23 to close their cost-tracking gap. DeepSeek moved
        # to peak/off-peak billing + raised list rates effective 2026-08-16
        # (verified 2026-08-28 against api-docs.deepseek.com/quick_start/pricing,
        # fetched live): cache-miss input off-peak $0.22 / peak $0.44 per 1M,
        # output off-peak $0.66 / peak $1.32 per 1M, cache-hit input off-peak
        # $0.007. Peak = 01:00-04:00 & 06:00-10:00 UTC Mon-Fri; off-peak = half,
        # all other hours + weekends. Registry pins the off-peak (standard,
        # modal) rate; peak is +100%. Was $0.14/$0.28 flat pre-2026-08-16.
        # Context 1M / max output 384K per api-docs.deepseek.com
        # ("MAX OUTPUT | MAXIMUM: 384K"), verified 2026-07-19 with live
        # api.deepseek.com calls (max_tokens 16384/65536/384000 all HTTP 200;
        # the V3-era [1, 8192] wall does not apply here). 384000 is the
        # provider's published output maximum; stages needing a tighter cap
        # pin it on the rung — the three classifier rungs in
        # ladders_mentor.yaml pin 8192.
        capabilities: [structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 384000
        unit_type: tokens
        # NOTE — TIME-OF-DAY PRICE: the cost_per_1k_* below is the OFF-PEAK
        #   rate = LOWER BOUND. Peak bills 2× during 01:00-04:00 & 06:00-10:00
        #   UTC, Monday-Friday (off-peak = all other hours + weekends);
        #   DeepSeek introduced this split 2026-08-16. A bill reconciled
        #   against this number reads up to 2× higher for peak-hour calls.
        cost_per_1k_in: 0.00022
        cost_per_1k_out: 0.00066
      - id: deepseek-v4-pro
        # "Smart" / deep-reasoning tier — Methodist ladder PRIMARY (bottomup +
        # topdown). DeepSeek moved to peak/off-peak billing + raised list rates
        # effective 2026-08-16 (verified 2026-08-28 against
        # api-docs.deepseek.com/quick_start/pricing, fetched live): cache-miss
        # input off-peak $0.66 / peak $1.32 per 1M, output off-peak $1.98 /
        # peak $3.96 per 1M, cache-hit input off-peak $0.022. Peak = 01:00-04:00
        # & 06:00-10:00 UTC Mon-Fri; off-peak = half, all other hours +
        # weekends. Registry pins the off-peak (standard, modal) rate; peak is
        # +100% — schedule the Methodist pass off-peak to pay the pinned rate.
        # Was $0.435/$0.87 flat (verified 2026-07-26; that rate was itself the
        # post-promo permanent list after the old $1.74/$3.48 durable retired
        # 2026-05-31). Context 1M / max output 384K per the official DeepSeek
        # docs verified 2026-06-05;
        # the conservative ``max_output_tokens`` here (65536) mirrors the video
        # Pass 2a ladder pin — the model's true output ceiling is far higher,
        # but the cap above which we have empirical evidence of clean emission
        # is the spike's observed ~23k token thinking-on output (RUN_SMOKE #2,
        # B-spike series). Raise as new stages exercise more output.
        # Reasoning-mode behaviour: per KD-2.4-T this model is routed via the
        # ``deepseek_thinking`` provider for reasoning-tier stages (video Pass
        # 2a) so the thinking-on default is preserved; the ``deepseek`` provider
        # (KD-2.4-S) still applies thinking-disabled for schema-bound consumers
        # and can be used with this model when that contract is required.
        capabilities: [structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        # NOTE — TIME-OF-DAY PRICE: the cost_per_1k_* below is the OFF-PEAK
        #   rate = LOWER BOUND. Peak bills 2× during 01:00-04:00 & 06:00-10:00
        #   UTC, Monday-Friday (off-peak = all other hours + weekends);
        #   DeepSeek introduced this split 2026-08-16. A bill reconciled
        #   against this number reads up to 2× higher for peak-hour calls.
        cost_per_1k_in: 0.00066
        cost_per_1k_out: 0.00198

