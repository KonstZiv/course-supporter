# ============================================================
# Unified external service registry
# ============================================================
# Covers LLM providers, transcription, and future integrations.
# ModelRouter uses strategies + actions to build fallback chains.

providers:
  gemini:
    type: llm
    models:
      # Pricing verified 2026-05-23 against ai.google.dev/gemini-api/docs/pricing
      # (paid tier, text input). Registry uses per-1k = per-1M / 1000.
      - id: gemini-3.5-flash
        # Latest Gemini flash (registered 2026-05-23). $1.50 / $9.00 per 1M.
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        cost_per_1k_in: 0.0015
        cost_per_1k_out: 0.009
      - id: gemini-3.1-flash-lite
        # Cost-tier flash — audio Pass 2a/2c primary rung (registered
        # 2026-05-23; was callable but unregistered → no cost-tracking).
        # $0.25 / $1.50 per 1M.
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        cost_per_1k_in: 0.00025
        cost_per_1k_out: 0.0015
      - id: gemini-3-flash-preview
        # Preview model — relief when gemini-2.5-flash is throttled (503).
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        # Official rate (was PROVISIONAL 2.5-flash proxy): $0.50 / $3.00 per 1M.
        cost_per_1k_in: 0.0005
        cost_per_1k_out: 0.003
      - id: gemini-2.5-flash
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        # Corrected 2026-05-23 (was 0.00015 / 0.0006 — a gpt-4o-mini rate that
        # understated output ~4×): official $0.30 / $2.50 per 1M.
        cost_per_1k_in: 0.0003
        cost_per_1k_out: 0.0025
      - id: gemini-2.5-pro
        capabilities: [vision, structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        # Corrected 2026-05-23 (out was 0.005, understated 2×): official
        # $1.25 / $10.00 per 1M (≤200k-prompt tier).
        cost_per_1k_in: 0.00125
        cost_per_1k_out: 0.010

  anthropic:
    type: llm
    # Date-pinned snapshot IDs (reproducibility). Pricing verified 2026-05-23
    # against platform.claude.com/docs (.../about-claude/pricing).
    models:
      - id: claude-sonnet-4-5-20250929
        # Sonnet 4.5 — current Sonnet snapshot (registered 2026-05-23;
        # replaces deprecated claude-sonnet-4-20250514). $3 / $15 per 1M.
        # (claude-sonnet-4-6 is newer + same price but ships only as a
        # non-date-pinned alias, against the snapshot convention.)
        capabilities: [structured_output, long_context]
        max_context: 200000
        max_output_tokens: 16384
        unit_type: tokens
        cost_per_1k_in: 0.003
        cost_per_1k_out: 0.015
      - id: claude-haiku-4-5-20251001
        # Haiku 4.5 — cost tier; audio Pass 2a/2c rung 3 (registered
        # 2026-05-23 → closes DD-2.3-Z; was callable but unregistered).
        # $1 / $5 per 1M.
        capabilities: [structured_output, long_context]
        max_context: 200000
        max_output_tokens: 16384
        unit_type: tokens
        cost_per_1k_in: 0.001
        cost_per_1k_out: 0.005
      - id: claude-opus-4-20250514
        # DEPRECATED (Anthropic pricing page 2026-05-23). Retained only for
        # legacy ModelRouter action references; migrate to a current Opus
        # (e.g. claude-opus-4-5) when next touched. $15 / $75 per 1M.
        capabilities: [structured_output, long_context]
        max_context: 200000
        max_output_tokens: 32768
        unit_type: tokens
        cost_per_1k_in: 0.015
        cost_per_1k_out: 0.075
      - id: claude-sonnet-4-20250514
        # DEPRECATED (Anthropic pricing page 2026-05-23). Superseded by
        # claude-sonnet-4-5-20250929 above; retained only for legacy
        # ModelRouter action references. $3 / $15 per 1M.
        capabilities: [structured_output, long_context]
        max_context: 200000
        max_output_tokens: 16384
        unit_type: tokens
        cost_per_1k_in: 0.003
        cost_per_1k_out: 0.015

  openai:
    type: llm
    models:
      - id: gpt-4o-mini
        capabilities: [vision, structured_output]
        max_context: 128000
        max_output_tokens: 16384
        unit_type: tokens
        cost_per_1k_in: 0.00015
        cost_per_1k_out: 0.0006
      - id: gpt-4.1
        capabilities: [vision, structured_output, long_context]
        max_context: 1047576
        max_output_tokens: 32768
        unit_type: tokens
        cost_per_1k_in: 0.002
        cost_per_1k_out: 0.008
      - id: gpt-4o
        capabilities: [vision, structured_output, long_context]
        max_context: 128000
        max_output_tokens: 16384
        unit_type: tokens
        cost_per_1k_in: 0.0025
        cost_per_1k_out: 0.01

  deepseek:
    type: llm
    # Live IDs verified 2026-05-23 (api.deepseek.com/models): the lineup is now
    # deepseek-v4-flash + deepseek-v4-pro. deepseek-chat / deepseek-reasoner are
    # being deprecated by DeepSeek (they map to the non-thinking / thinking
    # modes of deepseek-v4-flash). Pricing per api-docs.deepseek.com/pricing.
    models:
      - id: deepseek-v4-flash
        # Current flash tier (replaces deepseek-chat). Referenced by the
        # safety_check / safety_check_authored / pass_2a_mapping ladders —
        # registered 2026-05-23 to close their cost-tracking gap. $0.14/$0.28
        # per 1M. Same 8192 output hard-cap as deepseek-chat (see below).
        capabilities: [structured_output]
        max_context: 131072
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.00014
        cost_per_1k_out: 0.00028
      - id: deepseek-v4-pro
        # "Smart" / deep-reasoning tier. Regular $1.74/$3.48 per 1M; a 75%
        # promo runs to 2026-05-31 (~$0.435/$0.87). Registry uses the durable
        # regular rate to avoid a silent post-promo jump. Reasoning output may
        # warrant a per-rung max_output_tokens override above 8192.
        capabilities: [structured_output, long_context]
        max_context: 131072
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.00174
        cost_per_1k_out: 0.00348
      - id: deepseek-chat
        # DEPRECATED by DeepSeek (maps to deepseek-v4-flash non-thinking).
        # Retained for legacy ModelRouter action references.
        capabilities: [structured_output]
        max_context: 131072
        # DeepSeek-chat hard-caps max_tokens at 8192 (HTTP 400 otherwise —
        # verified empirically on 2026-04-13 after an incorrect bump to
        # 16384 caused every material_outline call to return
        # 'Invalid max_tokens value, the valid range of max_tokens is
        # [1, 8192]'). For long transcripts that exceed 8k output we rely
        # on the fallback chain (Claude Sonnet) — the proper fix is the
        # long-video chunking project.
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.00014
        cost_per_1k_out: 0.00028

  mistral:
    type: llm
    models:
      - id: mistral-large-2512
        # Mistral Large 3 (Dec 2025 release, Apache 2.0). Pinned to the
        # explicit dated revision per Phase 2.3 SPIKE-RESULTS-v2 §3 —
        # spike v2 sealed this ID; alias `mistral-large-latest` is
        # avoided to keep production runs reproducible across silent
        # Mistral version bumps.
        capabilities: [structured_output, long_context]
        max_context: 131072
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.002
        cost_per_1k_out: 0.006
      - id: mistral-small-latest
        capabilities: [vision, structured_output]
        max_context: 131072
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.0001
        cost_per_1k_out: 0.0003

  dashscope:
    type: llm
    # Qwen text-reasoning flagships available in the eu-central-1 MaaS workspace
    # (verified 2026-05-23 against the workspace /models list). Date-pinned per
    # the snapshot convention. Pricing PROVISIONAL — see per-model notes; MaaS
    # eu-central rates may differ from the public International list and must be
    # reconciled after the first production billing cycle (same caveat as
    # qwen3-vl). Reasoning/"thinking" variants (qwen3-235b-a22b-thinking-2507,
    # qwen3-next-80b-a3b-thinking) are also workspace-available — add on demand.
    models:
      - id: qwen3.7-max-2026-05-20
        # Latest Qwen flagship "Max" (text reasoning; released 2026-05-20).
        # Context 1M / output 65536 confirmed from OpenRouter listing
        # 2026-06-02. Pricing $2.50/$7.50 per 1M is the Alibaba direct
        # durable regular rate (cross-checked via artificialanalysis.ai).
        # OpenRouter / pricepertoken list $1.25/$3.75 — an exact 2× delta
        # against the Alibaba direct rate (a 50% promo signature); registry
        # convention prefers the durable regular rate to avoid a silent
        # post-promo jump (precedent: deepseek-v4-pro). The Alibaba Model
        # Studio public pricing page did not yet list qwen3.7-max as of
        # 2026-06-02 — refresh this entry once it does and reconcile.
        capabilities: [structured_output, long_context]
        max_context: 1048576
        max_output_tokens: 65536
        unit_type: tokens
        cost_per_1k_in: 0.0025
        cost_per_1k_out: 0.0075
      - id: qwen3-max-2026-01-23
        # Stable Qwen flagship "Max" (text). PROVISIONAL: public International
        # ≤32k-prompt tier ($1.2/$6 per 1M); higher tiers apply above 32k input.
        capabilities: [structured_output, long_context]
        max_context: 262144
        max_output_tokens: 32768
        unit_type: tokens
        cost_per_1k_in: 0.0012
        cost_per_1k_out: 0.006
      - id: qwen3-vl-32b-instruct
        # Phase 2.3 Pass 1 R1 (multimodal) per SPIKE-RESULTS-v2.md §3.
        # PROVISIONAL pricing — values reflect DashScope International
        # Singapore tier public docs; eu-central-1 MaaS workspace
        # pricing may differ and should be reconciled after the first
        # production billing cycle.
        capabilities: [vision, structured_output, long_context]
        max_context: 131072
        max_output_tokens: 8192
        unit_type: tokens
        cost_per_1k_in: 0.00076
        cost_per_1k_out: 0.00228

  whisper:
    type: transcription
    models:
      - id: base
        unit_type: minutes
        local: true

  # --- STT providers ---
  elevenlabs:
    type: stt
    models:
      - id: scribe_v1
        unit_type: minutes
        cost_per_minute: 0.0037

  openai_stt:
    type: stt
    models:
      - id: gpt-4o-mini-transcribe
        unit_type: minutes
        cost_per_minute: 0.003

  deepgram:
    type: stt
    models:
      - id: nova-3
        unit_type: minutes
        cost_per_minute: 0.0052

strategies:
  default:
    providers: [gemini, anthropic, openai, deepseek]
    fallback: true
  quality:
    providers: [anthropic, gemini]
    fallback: true
  budget:
    providers: [deepseek, gemini]
    fallback: true
  transcription:
    providers: [gemini, whisper]
    fallback: true
  stt_default:
    providers: [elevenlabs, openai_stt, deepgram]
    fallback: true
  stt_quality:
    providers: [elevenlabs, openai_stt]
    fallback: true
  stt_budget:
    providers: [deepgram, openai_stt]
    fallback: true

actions:
  video_analysis:
    strategy: default
    requires: [vision, long_context]
    chain:
      default: [gemini-2.5-flash, gemini-2.5-pro]
      quality: [gemini-2.5-pro, gemini-2.5-flash]
      budget: [gemini-2.5-flash]

  presentation_analysis:
    strategy: default
    requires: [vision, structured_output]
    chain:
      default: [gemini-2.5-flash, gpt-4o-mini]
      quality: [gemini-2.5-pro, gemini-2.5-flash]

  course_structuring:
    strategy: default
    requires: [structured_output]
    chain:
      # Sonnet (16384 output) is the rescue model when DeepSeek hits the
      # 8192 max_tokens length limit on wide subtrees (4+ materials,
      # ~11K+ input tokens). Matches the fallback pattern already used in
      # `methodist` and documented in the deepseek-chat model comment.
      default: [gemini-2.5-flash, deepseek-chat, claude-sonnet-4-20250514]
      quality: [claude-sonnet-4-20250514, gemini-2.5-pro]
      budget: [deepseek-chat]

  text_processing:
    strategy: default
    requires: [structured_output]
    chain:
      default: [deepseek-chat, gemini-2.5-flash]
      quality: [claude-sonnet-4-20250514, gemini-2.5-flash]
      budget: [deepseek-chat]

  transcribe:
    strategy: stt_default
    chain:
      default: [scribe_v1, gpt-4o-mini-transcribe, nova-3]
      quality: [scribe_v1, gpt-4o-mini-transcribe]
      budget: [nova-3, gpt-4o-mini-transcribe]

  material_outline:
    strategy: default
    requires: [structured_output]
    chain:
      default: [deepseek-chat, claude-sonnet-4-20250514]
      quality: [claude-sonnet-4-20250514, gemini-2.5-pro]
      budget: [deepseek-chat]
      # Per-model chains for A/B spike testing
      claude-sonnet-4-20250514: [claude-sonnet-4-20250514]
      gpt-4o: [gpt-4o]
      gpt-4.1: [gpt-4.1]
      deepseek-chat: [deepseek-chat]

  methodist:
    strategy: default
    requires: [structured_output]
    chain:
      default: [deepseek-chat, claude-sonnet-4-20250514]
      quality: [claude-sonnet-4-20250514, gemini-2.5-pro]
      budget: [deepseek-chat]

  safety_check:
    strategy: default
    requires: [structured_output]
    chain:
      default: [deepseek-chat, gemini-2.5-flash]

  task_matching:
    strategy: default
    requires: [structured_output]
    chain:
      default: [deepseek-chat, gemini-2.5-flash]

  homework_analysis:
    strategy: budget
    requires: [structured_output]
    chain:
      default: [deepseek-chat, mistral-large-2512, gemini-2.5-flash]

  homework_humanize:
    strategy: quality
    chain:
      default: [claude-opus-4-20250514, gemini-2.5-pro, mistral-large-2512]

  describe_slides:
    strategy: default
    requires: [vision]
    chain:
      default:
        - gemini-3-flash-preview
        - gemini-2.5-flash
        - mistral-small-latest
        - gpt-4o-mini

  vd_frame_analysis:
    strategy: default
    requires: [vision]
    chain:
      default:
        - gemini-3-flash-preview
        - gemini-2.5-flash
        - mistral-small-latest
        - gpt-4o-mini
      quality: [gemini-2.5-pro, gemini-2.5-flash]
      budget: [mistral-small-latest, gpt-4o-mini]

  vd_memory:
    strategy: default
    chain:
      default:
        - gemini-3-flash-preview
        - gemini-2.5-flash
        - mistral-small-latest
