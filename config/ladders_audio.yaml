# Audio source-type stage ladders (Phase 2.2, KD-2.2-A + KD-2.2-G).
#
# Per-source-type calibration lives in its own file (separate from
# ``ladders_pipeline.yaml``) because audio Pass 2a has different
# cost / quality / determinism characteristics than text/web Pass 2a:
# the input is a word-aligned transcript, the output binds
# ``word_idx`` ranges (KD-2.2-F bridge), and the rung 1 winner is
# Gemini Flash Lite rather than DeepSeek V4 Flash. ``ladder_config.py``
# discovers this file automatically via the ``ladders_*.yaml`` glob
# (loader at ``src/course_supporter/llm/ladder_config.py:116``).
#
# Two stages live here:
#   * ``audio_pass_2a_mapping``  — Pass 2a metadata mapping. JSON-object
#                                  output validated against
#                                  ``AudioPass2aResult`` (KD-2.2-H).
#   * ``audio_pass_2c_denoise``  — Pass 2c selective denoise. Single
#                                  plain-text output wrapped into
#                                  ``AudioPass2cResult.content`` by the
#                                  StageRouter ``response_validator``
#                                  closure (KD-2.2-I; distinct pattern
#                                  from Pass 2a's JSON-object shape).
#
# Ladder rationale (ratified 2026-05-15 per INVESTIGATION.md §1.1 P1):
#   1. gemini-3.1-flash-lite — cost-first primary. P1 multi-candidate
#      probe (3 runs, 3 materials) returned 3/3 valid hierarchies with
#      0% variance at ~$0.005/call and ~6.1s p50 latency for a
#      ~125-minute Ukrainian audio transcript. Model identifier swap
#      preview → GA was ratified at the same session — the GA channel
#      is expected to behave identically (verification deferred to the
#      §4 acceptance gate 6.5 smoke check).
#   2. deepseek-flash — second tier (2026-09-30; was gemini-2.5-flash,
#      which answers our key 404 "no longer available to new users").
#   3. Pass 2a: mistral-large-2512; Pass 2c: mistral-small-latest —
#      third tier (2026-09-30, operator decision; was
#      claude-haiku-4-5-20251001: the Anthropic account has no credit
#      and Anthropic is dropped from the ladders as too dear).
#   Three rungs, three providers. Rungs 2 and 3 are not calibrated on
#   these stages; the live check after deployment is the first signal.
#
# DeepSeek V4 Flash was kept OUT of these ladders until 2026-09-30. A
# narrow probe (vision-side commissioned, 2026-05-15) returned 1/3
# hierarchy-valid on Pass 2a, with the parent's ``end_word_idx``
# inheriting from the last subsegment and leaving trailing words
# uncovered (DD-2.2-X, PHASE.md §2.5). It is back as rung 2 because
# the dead rung left no working fallback at all; a hierarchy failure
# on it is caught by the schema validators and descends to rung 3.
#
# Snapshot convention: gemini / deepseek / mistral models use aliases
# or provider-named versions (latest stable; provider-side stability
# guarantee per existing repo convention).

stages:
  # Pass 2a metadata mapping for audio ingestion (KD-2.2-A + KD-2.2-H).
  # Input: word-aligned transcript (``STTResult.words``) with
  # ``total_word_count`` context. Output: ``AudioPass2aResult`` JSON
  # — segments with ``start_word_idx``/``end_word_idx``, optional
  # subsegments (≤5 per segment), ``noisy`` flags, concept tiers.
  # Schema invariants enforced by Pydantic validators:
  # ``_segments_contiguous`` + ``_full_cover`` + ``_subsegments_cover_parent``.
  audio_pass_2a_mapping:
    prompt_ref: "prompts/audio_pass_2a_mapping/v1.md"
    requires: [json_mode]
    ladder:
      - provider: gemini
        model: gemini-3.1-flash-lite
      - provider: deepseek
        model: deepseek-flash
      - provider: mistral
        model: mistral-large-2512

  # Pass 2c selective denoise for audio ingestion (KD-2.2-A + KD-2.2-I).
  # Input: a single noisy segment's raw text plus Pass 2a metadata
  # (title / description / concepts) for orientation. Output: a
  # single plain-text string — cleaned transcript with disfluencies
  # removed, semantic content and word order preserved. The
  # StageRouter ``response_validator`` wraps the raw LLM string
  # into ``AudioPass2cResult.content`` at consumption time.
  #
  # Same ladder shape as ``audio_pass_2a_mapping`` per KD-2.2-A
  # ("same shape, separate config block"): denoise quality
  # characteristics are expected to track Pass 2a closely on this
  # rung selection — both stages emit short, structured outputs
  # over short, focused inputs.
  #
  # Per-rung ``max_output_tokens: 8192`` (task 2.4.7): audio Pass 2c was inert
  # in production until 2.4.7 wired the injected stage_router, so this stage's
  # output budget was never actually exercised. Probe (2026-05-23): the
  # StageRouter calls providers directly, so an unpinned rung sends
  # ``max_tokens=None`` — gemini uses its implicit model default, anthropic its
  # provider default (8192) — divergent per provider. The explicit 8192 pin
  # makes the budget identical and explicit on every rung (mirrors Pass 1 / 2a)
  # so a truncated denoise can't hide behind a silent per-provider default. It
  # comfortably covers one segment's cleaned transcript (~15 min ≈ 3.5k tokens);
  # there is no 4096 cap here (that is the DashScope default; no DashScope rung).
  audio_pass_2c_denoise:
    prompt_ref: "prompts/audio_pass_2c_denoise/v1.md"
    ladder:
      - provider: gemini
        model: gemini-3.1-flash-lite
        max_output_tokens: 8192
      - provider: deepseek
        model: deepseek-flash
        max_output_tokens: 8192
      - provider: mistral
        model: mistral-small-latest
        max_output_tokens: 8192
