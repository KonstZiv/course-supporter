# Mentor agent stage ladders (KD16).
#
# The real Mentor review stages (three-layer graph, config-driven per
# vision D12) are added here in sprint-mentor T6. The old scaffold
# stage was removed with the green-field cleanup (T1).
stages:
  # Stage 2 LLM safety classifier per vision §KD14. Cheap binary
  # judgement on student submissions that already passed Stage 1
  # synchronous validation (size / magic / archive / unicode /
  # regex). Output is a strict JSON SafetyResult; semantic parse
  # failure raises terminal SafetyValidationError per 0.6 acceptance.
  #
  # Model pick rationale (KD-D cost optimization): mistral-small-latest
  # is the economical primary because the task is binary classification
  # against a fixed schema -- frontier reasoning capability would be
  # overkill. Override of the factory default mistral-large-2512 is
  # intentional; do NOT "fix" by reverting to large unless safety-
  # accuracy telemetry shows small underperforming.
  # gemini-3.5-flash-lite is the equivalent-tier fallback for
  # infrastructure outages on the primary; ladder order is by
  # historical reliability, not capability. (2026-09-30: the Gemini rung
  # was gemini-2.5-flash, which answers our key 404 "no longer available to
  # new users". 2026-11-05: the deepseek-flash rung between the two was
  # removed — the product owner took DeepSeek and Alibaba off the students'
  # texts; the same on safety_check_authored and sanity_check below. The
  # 8192 pin N20 put on that rung (2026-07-19) went with it: the two rungs
  # left were never pinned.)
  #
  # Snapshot convention: this ladder uses provider aliases for both
  # rungs (mistral / gemini) -- "latest stable",
  # relying on provider-side stability guarantees per existing repo
  # convention (mirrors ladders_pipeline.yaml pass_2a_mapping). Where
  # an Anthropic model appears in a ladder it is pinned to a
  # date-stamped snapshot for deterministic reproducibility; no
  # Anthropic rung is used here. Migrating the alias rungs to pinned
  # snapshots is tracked as a cross-cutting operational item, not a
  # Phase 2.1 concern.
  safety_check:
    prompt_ref: "prompts/safety_check/v2.md"
    requires: [json_mode]
    # Student-chain oversize guard (step E). Declared on every stage the
    # student's submission reaches, so an oversize context skips a rung whose
    # window cannot hold it instead of paying for the refusal: without the
    # ratio the router does no estimation at all (llm/stage_router.py:234).
    # Same value as safety_check_authored above -- one idea of what a prompt
    # costs, not two. The hard refusal that fires before any call at all is
    # derived from these same first rungs (homework/text_budget.py).
    input_budget_ratio: 0.5
    ladder:
      - provider: mistral
        model: mistral-small-latest
      - provider: gemini
        model: gemini-3.5-flash-lite

  # Authored-context Stage 2 (Phase 2.3 hotfix). Same cheap binary
  # classifier ladder as ``safety_check``; routed to the authored
  # prompt via ``run_stage2_safety_check(content_kind="authored")``.
  # Authored materials are trusted more than homework: advertising,
  # branding, contact info, and external links are NOT violations;
  # off_topic is high-bar. Injection / policy / suspicious preserved.
  safety_check_authored:
    prompt_ref: "prompts/safety_check_authored/v1.md"
    requires: [json_mode]
    # F6 (task-code-materials, ratified 2026-07-12): oversize authored
    # input (large code/text/web surfaces) skips the mistral-small rung
    # and lands on rung 2, instead of being silently provider-truncated.
    # Rung 2 is gemini-3.5-flash-lite (1 048 576 context) since 2026-11-05;
    # it was deepseek-flash, with the same window, removed with the
    # safety_check rung. The budget is computed per rung from that rung's
    # own max_context (llm/stage_router.py), so an oversize input has one
    # rung left, not two.
    # Applies to ALL authored source types — accepted deliberately as an
    # improvement. Last-resort byte backstop (1.5 MiB + loud warning)
    # lives at the call site (api/tasks.py:_bound_safety_text).
    input_budget_ratio: 0.5
    ladder:
      - provider: mistral
        model: mistral-small-latest
      - provider: gemini
        model: gemini-3.5-flash-lite

  # ── sanity_check (sprint-mentor T7, vision §1336-1339 / KD16 §1452) ──
  # Lightweight validity gate between safety and review: "does the submission
  # look like an attempt at the declared task?" → {verdict, confidence, reason}.
  # Its purpose is economy — skip the expensive three-phase review graph on
  # obvious garbage — so the model tier is the CHEAP binary classifier, the same
  # tier as ``safety_check`` (mistral-small primary; gemini-3.5-flash-lite
  # the equivalent-tier fallback for outages — deepseek-flash between them
  # until 2026-11-05, see safety_check). Frontier reasoning would be
  # overkill for a coarse triage decision; a high confidence_threshold
  # (config/sanity.yaml) keeps the gate conservative regardless of model. Alias
  # rungs ("latest stable") per the safety_check convention.
  sanity_check:
    prompt_ref: "prompts/sanity_check/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    ladder:
      - provider: mistral
        model: mistral-small-latest
      - provider: gemini
        model: gemini-3.5-flash-lite

  # ── criteria_decomposition (sprint-mentor T4, vision §1386 / D11) ──
  # Decomposes a task AuthoredDocument into the checkable review criteria
  # the Mentor graph (T6) scores against. Computed ONCE per task version
  # and kept as its criteria list (task_criteria_lists, mentor-rebuild task
  # 08) — a correctness/fairness guarantee, not an optimisation: the step is
  # non-deterministic, so without the list two attempts at the same task
  # would be graded against different criteria. Prompt v2 (task 08): the
  # criterion form of homework/criteria_form.py — weights, check methods,
  # concepts from the input, mandatory points; v1 stays in the tree for the
  # register rows that name it.
  #
  # Model pick: a structured reasoning task over one task document
  # (decompose requirements → atomic criteria), NOT a cheap binary
  # classifier like safety_check. The reasoning tier mirrors the
  # methodist stages (the closest comparable synthesis workload). Cost is
  # amortised across every attempt at the task (cache hit ⇒ zero further
  # LLM calls), so a capable primary is justified. Since 2026-11-05 the
  # ladder is Gemini, then Mistral — the strongest of each in the registry
  # that our key can call (DeepSeek and Alibaba taken off the students'
  # chain by the product owner; this stage is on it, text_budget.py
  # STUDENT_LADDER_STAGES). ``requires: [json_mode]`` only —
  # ``long_context`` is deliberately NOT required: the input is a single
  # task document, not a subtree (the methodist_topdown rationale), so
  # requiring it would falsely exclude legitimate rungs. ``input_budget_ratio``
  # was absent here until step E on the reasoning that a per-task one-shot does
  # not need the per-rung budget-skip machinery; the E run showed the stage does
  # descend a rung on a large task and pays for the attempt, so it now carries
  # the ratio like the rest of the student chain.
  criteria_decomposition:
    prompt_ref: "prompts/criteria_decomposition/v2.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    ladder:
      # Rung 1 ceiling: 32768 (hotfix 1, ratified 2026-09-14, kept on the new
      # model 2026-11-05). gemini-3.8-flash counts its reasoning inside
      # max_output_tokens and the connector cannot limit it
      # (config/external_services.yaml) — the fault hotfix 1 fixed on the
      # previous rung 1, deepseek_thinking/deepseek-v4-pro: at 8192 its
      # reasoning ate the whole ceiling, on 2026-09-07 it returned 8192 output
      # tokens and an EMPTY body, and the decomposition was paid twice. Prod
      # register of that rung, all on inputs under 2.5k tokens: 7696
      # (success), 6345 (success), 8192 (ceiling hit, empty). The largest
      # successful output with reasoning was 7696, so 32768 leaves a fourfold
      # margin; the same need carries over to a model that reasons inside the
      # same ceiling. Registry cap 65536. NOT CALIBRATED on gemini-3.8-flash:
      # its reasoning length and speed on this stage are not measured; the
      # first live runs are the data. Worst-case cost at a 2.5k-token input:
      # 2 500 x 0.00075/1k + 32 768 x 0.00375/1k = $0.1248 at the introductory
      # price (twice that from 2027-01-01), once per task version, not per
      # submission.
      - provider: gemini
        model: gemini-3.8-flash
        max_output_tokens: 32768
      # Rung 2 ceiling: 8192 — mistral-large-2512's registry cap (the
      # first-party ceiling is not published), under the 16384 task 08 gave
      # the rungs after the first (section 9 decision 6, 2026-09-29) for the
      # mandatory points of the v2 form. Observed 2026-09-07: 18 criteria on
      # qwen3.7-max took 5707 output tokens, 4036 of them reasoning — an
      # answer of ~1.7k; mistral-large-2512 does not reason, so the whole
      # 8192 is answer room.
      - provider: mistral
        model: mistral-large-2512
        max_output_tokens: 8192

  # ── key_explanation (mentor-rebuild task 06) ──
  # Writes one explanation per question of a test's answer key: why the answer
  # the AUTHOR gave is the right one. Runs ONCE per (task version, answers,
  # language), outside any student submission — the same shape as
  # criteria_decomposition above, and calibrated as a copy of it because the
  # workload is the same kind: structured reasoning over one task document,
  # amortised across every attempt at the test rather than paid per submission.
  #
  # The name does not repeat any stage of config/submission_paths.yaml (`safety`,
  # `attempt_classifier`): the call register keys a call's cost on the stage
  # name, so two different stages sharing one name would merge two prices.
  #
  # NOT CALIBRATED: no spike was run for this stage. The ladder, the rung-1
  # output ceiling and the budget ratio are copied from criteria_decomposition,
  # whose rationale (hotfix 1, ratified 2026-09-14) is that a rung-1 model
  # that counts reasoning inside max_output_tokens — deepseek_thinking then,
  # gemini-3.8-flash since 2026-11-05 — needs room beyond 8192 for the
  # answer. The first live run of this stage is the calibration data. Rung 2
  # keeps 8192: task 08 raised criteria_decomposition's for the mandatory
  # points of its v2 form, which explanations do not carry. The funds port's
  # estimate of one attempt, KEY_EXPLANATION_CEILING_USD
  # (agents/key_explainer.py), is counted from this ladder.
  #
  # Prompt v2 (mentor-rebuild task 07): a doubt flag per question beside each
  # explanation, and the reason told through the option's content, not its
  # label. v1 stays in the tree: the versions it wrote are not regenerated (the
  # prompt is not part of a version's key, task 07 decision 3), and the
  # register rows of their jobs name it.
  key_explanation:
    prompt_ref: "prompts/key_explanation/v2.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    ladder:
      - provider: gemini
        model: gemini-3.8-flash
        max_output_tokens: 32768
      - provider: mistral
        model: mistral-large-2512
        max_output_tokens: 8192

  # ── Mentor review graph (sprint-mentor T6, vision §1369-1400 / D8-D12) ──
  # Three-phase review inside stage `review`. Ladders calibrated by reasoning
  # analogy (like criteria_decomposition — no pre-spike); quality of layered
  # judgement is an operator-gated LIVE acceptance gate, and ladder tuning is a
  # config lever for any layer-collapse seen on real homework.

  # Phase 1A — node + course layers (D8). Rubric application grounded in the
  # node/course NodeSummaryFinal + the cached criteria. DEEP reasoning tier
  # (the heaviest judgement: apply two rubrics against an untrusted submission),
  # mirroring criteria_decomposition. json_mode only; the input is one
  # submission + summaries, not a subtree, so no long_context requirement.
  mentor_layered_evaluation_node_course:
    prompt_ref: "prompts/mentor_layered_evaluation_node_course/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    ladder:
      # Rung 1 ceiling: 32768, not the 8192 the other rung carries (hotfix 2,
      # ratified 2026-09-17 — DD-SP-AY; kept on the new model 2026-11-05). The
      # fault hotfix 1 fixed one stage earlier: a model that counts its
      # reasoning inside max_output_tokens — deepseek_thinking then,
      # gemini-3.8-flash now, whose connector cannot limit it — can spend the
      # whole ceiling on reasoning and return an EMPTY body. Live run 1
      # (2026-09-17) is the measurement, on deepseek_thinking: the rung returned
      # exactly 8192 output tokens with an empty body (outcome
      # ``empty_at_output_ceiling``, finish_reason ``output_ceiling``), the
      # ladder descended and the layer was paid twice — $0.0446, the most
      # expensive row of the run. What pushed this stage over is hotfix 1
      # itself: the unblocked decomposition yields 37 criteria instead of 18,
      # and this rung applies them. NOT CALIBRATED on gemini-3.8-flash; a test
      # pins the value.
      - provider: gemini
        model: gemini-3.8-flash
        max_output_tokens: 32768
      # The fallback: the strongest Mistral in the registry, with JSON mode,
      # at its registry cap; its 262 144-token window keeps the submission
      # budget where safety_check and sanity_check put it
      # (homework/text_budget.py).
      - provider: mistral
        model: mistral-large-2512
        max_output_tokens: 8192

  # Phase 1B — industry layer (D8, autonomous). Same DEEP tier as 1A: an
  # independent professional judgement, deliberately course-free (the prompt
  # gets only the task + submission), so it is a separate stage to keep the
  # layer un-anchored from the course rubric (decision 1, anti-anchoring).
  mentor_layered_evaluation_industry:
    prompt_ref: "prompts/mentor_layered_evaluation_industry/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    ladder:
      # Rung 1 ceiling: 32768 (hotfix 2, ratified 2026-09-17 — DD-SP-AY).
      # Raised together with phase 1A above and for its reason, not its own
      # history: same provider, same tier, same submission judged with the same
      # model, so whatever grows one grows the other. This stage has not hit the
      # ceiling — 5285 and 6928 output tokens on the two measured prod runs — so
      # here the change is precaution, while for 1A it was repair (both
      # counted on deepseek_thinking). Model and rung 2 as above, since
      # 2026-11-05.
      - provider: gemini
        model: gemini-3.8-flash
        max_output_tokens: 32768
      - provider: mistral
        model: mistral-large-2512
        max_output_tokens: 8192

  # Phase 3 — denoising (D10): semantic recidivism/correction matching against
  # history + a bounded delta. MEDIUM tier — comparison, lighter than the
  # layered judgement. json_mode (strict JSON outcome).
  #
  # Since 2026-11-05 here and in synthesis below: gemini-3.8-flash, the
  # second rung until then, is the first (qwen3.7-max's place), and
  # mistral-large-2512 the second (deepseek-flash, the third, is gone).
  # Rung 1 pin 32768, up from the 8192 gemini-3.8-flash carried as rung 2:
  # its reasoning is counted inside max_output_tokens and the connector
  # cannot limit it, so the pin keeps qwen's answer room, 8192, plus the
  # 10 000 tokens of reasoning the path stages reserve for a first rung
  # (config/submission_paths.yaml, review_explanation), rounded up. On a
  # ladder stage an empty answer at the ceiling descends to rung 2 — paid
  # twice — rather than stopping. Mistral Large, not Small, for the 262 144
  # window: these stages carry the whole submission and its history. NOT
  # CALIBRATED.
  mentor_denoising:
    prompt_ref: "prompts/mentor_denoising/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    ladder:
      - provider: gemini
        model: gemini-3.8-flash
        max_output_tokens: 32768
      - provider: mistral
        model: mistral-large-2512
        max_output_tokens: 8192

  # Synthesis — the single human review (review_markdown). MEDIUM strong-
  # generation tier; this is writing quality, not reasoning depth. Plain
  # Markdown output, so `requires: []` (no json_mode) — mirrors the
  # pass_2c denoise text stages. Rungs and pins as on denoising above.
  mentor_synthesis:
    prompt_ref: "prompts/mentor_synthesis/v1.md"
    requires: []
    input_budget_ratio: 0.5
    ladder:
      - provider: gemini
        model: gemini-3.8-flash
        max_output_tokens: 32768
      - provider: mistral
        model: mistral-large-2512
        max_output_tokens: 8192
