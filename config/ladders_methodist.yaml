# Methodist agent stage ladders (KD16).
#
# Phase 3.2.3a landed ``methodist_bottomup``; Phase 3.2.3b adds
# ``methodist_topdown`` for the second pass (enclosing_context +
# observations append).
#
# ── methodist_bottomup ladder rationale ─────────────────────────
# Ratified per SPIKE-3-2-3-results.md (2026-06-11):
#
# * deepseek-v4-pro thinking — primary; spike median $0.022/call,
#   53s latency, hits 1-2k chars compressed_summary cleanly. Best
#   cost/quality on the methodist synthesis workload.
# * qwen3.7-max — fallback; spike median $0.054/call, 104s latency,
#   ~17% longer output than primary. Slower but provides extra
#   methodist depth when primary degrades.
# * gemini-2.5-flash control intentionally NOT registered as a third
#   rung — spike empirically showed it under-shoots the synthesis depth
#   target (median 1894 tokens out vs 4813 / 5651 for the two reasoning
#   tiers); a silent terminal-rung fallback to flash would degrade
#   methodist content quality without surfacing a failure signal.
#   Ladder exhaustion on this two-rung set is the loud signal that the
#   methodist call cannot proceed; the agent translates it into a
#   domain-level "restructure your course" message at the call site
#   (Phase 3.2.3a §5 contract).
#
# ── methodist_topdown ladder rationale ──────────────────────────
# Ratified per SPIKE-3-2-3-results.md §5 (2026-06-11):
#
# * deepseek-v4-pro thinking — primary; spike median $0.013/call,
#   26s latency, output 1878 tokens (1189 reasoning) — sits cleanly
#   in the KD10 1-2k tokens enclosing_context band. Best cost/quality
#   for the framing workload.
# * qwen3.7-max — premium fallback; spike median $0.043/call,
#   70s latency, output 3787 tokens (2972 reasoning) — over-shoots
#   the spec at ~5k chars enclosing_context but still legible; used
#   when primary degrades.
# * deepseek-v4-flash (named deepseek-flash since 2026-09-30, the same
#   model under DeepSeek's new name) — control; spike median $0.001/call,
#   18s latency, output 1203 tokens (737 reasoning) — surprisingly
#   competent honest methodist context. Cheap floor for deeper
#   subtrees where the top-down has already stabilised and the
#   call is mostly a refresh.
#
# gemini-2.5-pro thinking deliberately NOT included as a rung:
# DD-3.2.3-pre-C — empirical spike showed median output 346 tokens
# (~1200 chars) — well under the KD10 1-2k tokens spec. The OpenAI-
# compat endpoint does NOT expose Gemini's "extended thinking" mode
# the same way DeepSeek / Qwen do (reasoning_tokens=0 in usage
# breakdown), so the model effectively runs without budget for
# methodist reasoning. Until a native-Gemini path with explicit
# thinking_config lands, including gemini-2.5-pro here would silently
# down-shift enclosing_context quality on every rung-fallback case.
#
# ── Token-budget policy (shared) ────────────────────────────────
# Input budget per KD10: 0.5 ratio applied to each rung's
# ``max_context`` from the registry. The runtime check in StageRouter
# (Phase 3.2.3-pre) skips a rung when the estimated input exceeds
# ratio * max_context. Note: chars/3.5 estimator is empirically
# inaccurate for Ukrainian content (see DD-3.2.3-pre-B); for now
# the 0.5 ratio + universal estimator is the production baseline,
# with a tighter ratio or a tokenizer upgrade tracked separately.
stages:
  # v2 (2026-09-30): own documents split by role and task type —
  # methodological documents and tasks in full text, the rest as a summary —
  # and one unambiguous definition per output field (common_mistakes = the
  # student's mistakes, never the subject's pitfalls).
  methodist_bottomup:
    prompt_ref: "prompts/methodist_bottomup/v2.md"
    requires: [structured_output, long_context]
    input_budget_ratio: 0.5
    ladder:
      # Ceiling 32768 on both rungs, up from 16384 (2026-09-30). 16384 was
      # sized for the v1 answer; v2 reads methodological documents and tasks
      # in full and writes a much longer description (common_mistakes, success
      # criteria tagged base / pro, fuller observations). On a real lesson node
      # (~21k chars of full texts in) the first deepseek-v4-pro answer hit
      # 16384, the JSON was cut, the attempt was paid and dropped, and only
      # the retry passed. Registry limits (config/external_services.yaml):
      # deepseek-v4-pro 65536, qwen3.7-max 65536. deepseek_thinking counts the
      # reasoning inside max_output_tokens (see criteria_decomposition in
      # ladders_mentor.yaml), so the ceiling has to hold reasoning + JSON.
      # Time bounds: rung 1 at the observed ~60-69 tokens/s writes 32768 in
      # ~9 min against the 900 s HTTP read timeout (providers/openai_compat.py);
      # rung 2 is bounded by the DashScope client's 300 s default request
      # timeout, not by this ceiling. No money ceiling applies to this stage
      # (execute_for_stage passes none); worst case per attempt off-peak at
      # ~10k tokens in: rung 1 $0.039 -> $0.072, rung 2 $0.098 -> $0.179.
      - provider: deepseek_thinking
        model: deepseek-v4-pro
        max_output_tokens: 32768
      - provider: dashscope
        model: qwen3.7-max
        max_output_tokens: 32768

  # ``requires: [structured_output]`` — deliberately NOT ``[..., long_context]``.
  # Top-down input is small by construction: this node's own canonical state
  # plus six fields of the parent's canonical state plus the parent's
  # enclosing_context. Spike §3 measured ~3-8k chars on the stretch fixture,
  # which any rung's max_context comfortably fits. ``long_context`` is the
  # bottom-up requirement (it integrates every child's compressed_summary up
  # to the root, which DOES grow); applying it here would falsely exclude
  # legitimate rungs like deepseek-flash (1M context) without changing
  # what the stage actually needs.
  methodist_topdown:
    prompt_ref: "prompts/methodist_topdown/v1.md"
    requires: [structured_output]
    input_budget_ratio: 0.5
    ladder:
      # Ceiling 8192 kept on 2026-09-30 when the bottom-up ceiling was raised:
      # the top-down prompt (v1) and its answer — enclosing_context plus
      # appended observations — did not change with the full-text bottom-up
      # v2. Spike outputs, reasoning included: 1878 / 3787 / 1203 tokens on
      # the three rungs, so 8192 still leaves a twofold or larger margin.
      - provider: deepseek_thinking
        model: deepseek-v4-pro
        max_output_tokens: 8192
      - provider: dashscope
        model: qwen3.7-max
        max_output_tokens: 8192
      - provider: deepseek
        model: deepseek-flash
        max_output_tokens: 8192
