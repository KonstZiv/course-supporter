# Video source-type stage ladders (Phase 2.4, KD8/KD-2.3-X + KD-2.3-R/S).
#
# Per-source-type calibration lives in its own file (loader at
# ``src/course_supporter/llm/ladder_config.py`` discovers it via the
# ``ladders_*.yaml`` glob; stage names are globally unique across files).
# The video Pass 1 ("Eyes") profile differs from presentation Pass 1:
# multi-frame chunk-diff (N frames per call, chain-diff anchor/diff) rather
# than one image per call — but the canonical multimodal vehicle is the same
# ``StageRouter.execute_for_stage(..., contents=[jpeg_bytes, ...])`` (KD-2.3-R).
#
# One stage lives here:
#   * ``video_pass_1_vision`` — Pass 1 chain-diff frame description.
#     Plain-text output (NOT JSON), parsed into N ``FrameDescription`` by
#     the ``[FRAME HH:MM:SS]`` marker (symmetric with presentation Pass 1 /
#     audio Pass 2c plain-text shape). Image bytes flow through
#     ``contents=`` (PiP-masked by Pass 1 before the call).
#
# Ladder rationale (Phase 2.4 task 2.4.4; mechanism CI-landed,
# preservation/N calibration is the operator-run RUN_SMOKE spike, C6):
#
# Pass 1 — 3 rungs (mirrors presentation Pass 1 — same rung set):
#   1. dashscope/qwen3.5-flash — cost-first primary (TASK-4, 2026-07-31;
#      replaced qwen3-vl-32b-instruct, which retires 2026-10-10).
#      Calibration 2026-07-29 (vision-model-spike CALIBRATION-RESULTS.md,
#      decision Р7) on the 5-video matrix: zero reasoning tokens across
#      ~120 calls, block structure and coarse-segment content no worse
#      than the incumbent, ~4.6-4.9x cheaper and ~3.1-3.9x faster.
#      Routes through ``DashScopeProvider`` (KD-2.3-A native client).
#      Per-rung ``reasoning: {exclude: true}`` (KD-2.3-S) is ACTIVE
#      suppression — the model is thinking-capable and the connector
#      translates the binding to the native ``enable_thinking=False``
#      (TASK-3). ``max_output_tokens: 8192`` is NOT the model ceiling
#      (65536 in the registry) — it is the calibrated rung-uniform pin:
#      the chunk packer (vision.py ``_BUDGET_TOKENS = 6144``) targets 3/4
#      of it, and the whole calibration matrix ran with this value. Keep
#      unchanged — raising it is an uncalibrated change.
#   2. gemini/gemini-3-flash-preview — fallback 1. Multi-image native
#      (``GeminiProvider._build_contents`` wraps each bytes item as a Part).
#      Registry ceiling is 65536, but the per-rung ``max_output_tokens: 8192``
#      pins the budget contract rung-uniform so truncation surfaces as the
#      same chunk-parse mismatch regardless of which rung answered (it never
#      hides behind a silent fallback).
#      Kept deliberately in TASK-4: live fallback evidence 2026-07-29
#      (4 mid-job calls during the Lesson-1 calibration run, clean
#      completion). Reactive replacement trigger: preview retirement
#      notice or a throttling pattern; verified shortlist for that day
#      (registry rates 2026-07-26): gemini-3.6-flash,
#      gemini-3.5-flash-lite.
#   3. gemini/gemini-2.5-flash — fallback 2 / stable deep tier. Same 8192 pin.
#
# Anthropic (Claude) vision R3 rung **deferred** per DD-2.3-AD: no Claude
# *vision* model is registered (presentation ladder is likewise Qwen→Gemini,
# Anthropic native top-up not performed). Promote to a third rung when a
# Claude vision model is registered AND a ladder-exhaustion trigger fires.
#
# Snapshot convention: gemini / dashscope models use aliases (latest stable;
# provider-side stability per repo convention).

stages:
  # Pass 1 chain-diff frame description (KD-2.3-R + KD8/KD-2.3-X).
  # Input: N PiP-masked frame JPEGs through ``contents=`` +
  #   ``n_frames`` / ``frames`` (marker + mode per frame) Jinja render context.
  # Output: plain-text — N marked blocks, parsed by the ``[FRAME HH:MM:SS]``
  #   marker into N ``FrameDescription`` (anchor/diff). ``count != N`` or a
  #   marker mismatch raises ``StructuralRetryError`` (one retry → fallback).
  # Invocation site: ``video_pipeline.vision.run_pass_1`` (per-chunk
  #   bounded-concurrency gather inside ``VideoProcessor.process_raw``).
  video_pass_1_vision:
    prompt_ref: "prompts/video_pass_1_vision/v1.md"
    requires: [vision]
    ladder:
      - provider: dashscope
        model: qwen3.5-flash
        reasoning: {exclude: true}
        max_output_tokens: 8192
      - provider: gemini
        model: gemini-3-flash-preview
        max_output_tokens: 8192
      - provider: gemini
        model: gemini-2.5-flash
        max_output_tokens: 8192

  # Pass 2a semantic mapping (KD-2.2-A/F/H word-idx contract; landed in task
  # 2.4.5, retuned across tasks 2.4.12 / 2.4.17 as live evidence accumulated).
  # Input: transcript word-stream (``words_json`` + ``words_count``) + a
  #   deterministic visual-overlay block (``visuals``) via Jinja render
  #   context; image bytes do NOT flow here (text-reasoning, not vision).
  # Output: JSON validated against ``AudioPass2aResult`` (reused — same
  #   word-idx schema) by the ``step_5_pass2a_mapping`` response_validator;
  #   a ``ValidationError`` → ``StructuralRetryError`` (Path 3, as audio).
  #
  # Ladder rationale — 5-way spike 2026-06-05 (task-2.4.17).
  # ----------------------------------------------------------------------
  # The same single video matter (0I8S6diyDjw, ~10:48 English lecture,
  # 2653 STT words, 241 visual scenes) was Pass 2a'd through five models
  # using a byte-identical reconstructed prompt. The decisive metric was
  # the size of the largest segment (``%`` of duration AND chars); a
  # well-balanced split keeps it below ~30%.
  #
  #   | model                          | mode        | largest dur% | result   |
  #   | gemini-3.1-flash-lite          | cheap-tier  | 75.3%        | collapse |
  #   | qwen3.7-plus                   | cheap-tier  | 79.3%        | collapse |
  #   | deepseek-v4-pro (NON-thinking) | cheap-tier  | 66.8%        | collapse |
  #   | qwen3.7-max                    | reasoning   | 25.9%        | balanced |
  #   | deepseek-v4-pro (thinking ON)  | reasoning   | 23.5%        | balanced |
  #
  # The collapse pattern is a "catch-all tail" — the model bundles the last
  # half-plus of the transcript into one segment regardless of label
  # (gemini calls it "Closing Credits", plus calls it "Future of Science
  # Photography", non-think Pro calls it "The Future Role of Science
  # Photographers"). The empirical boundary is the reasoning budget:
  # 0 reasoning_tokens (non-think Pro, gemini-flash-lite) → collapse;
  # 5.5k reasoning_tokens (plus, cheap-tier) → still collapse; 21k
  # reasoning_tokens (Pro thinking on) → balanced. The two reasoning-tier
  # rungs (Pro thinking on, qwen3.7-max) both hold balance and emit
  # semantically equivalent segmentations.
  #
  # KD-2.4-T (Phase 2.4 task-2.4.17) ratified the per-stage thinking opt-in:
  # video Pass 2a goes through the new ``deepseek_thinking`` provider so the
  # DeepSeek default-on thinking is preserved (the standard ``deepseek``
  # provider keeps KD-2.4-S thinking-disabled for schema-bound stages).
  #
  # Rungs (post-task-2.4.17 — cost-first within reasoning-tier; flash-tier
  # is excluded as proven-collapsing on this workload):
  #   1. deepseek_thinking/deepseek-v4-pro — cheapest reasoning-tier.
  #      Highest
  #      latency (~7 min) is acceptable for background ingestion; tradeoff
  #      ratified per Q3 ratify 2026-06-05.
  #   2. dashscope/qwen3.7-max — diverse-provider rescue (different vendor /
  #      data-centre / billing surface from DeepSeek). Reasoning-tier
  #      flagship with 1M context and 65k output; ~4× faster than Pro.
  #   3. gemini/gemini-2.5-pro — last-resort escalation;
  #      reasoning-tier baseline at Google; survives outages where both
  #      DeepSeek and DashScope MaaS surfaces would be down.
  #
  # Dropped in task-2.4.17: gemini-3.1-flash-lite and gemini-2.5-flash.
  # Both are flash-tier and the 5-way spike empirically demonstrated they
  # collapse the long video Pass 2a workload (75% and unconfirmed-but-
  # presumed-similar; the registry-confirmed cheap-tier behaviour at 5.5k
  # reasoning_tokens is the supporting evidence).
  #
  # Anthropic / Sonnet R4 rung remains unavailable (operator credits
  # concern; restoration would slot it after gemini-2.5-pro).
  #
  # n=1 caveat (KD-2.4-T). Rung order is calibrated against a single
  # English mid-length lecture (~10:48). Other languages, very short
  # videos, very long videos warrant their own calibration cycle on live
  # operations per KD-2.3-X (per-source-type ladder calibration).
  #
  # Output-pin policy (DD-2.4-H). Per-rung ``max_output_tokens: 65536`` is
  # the sprint-wide video Pass 2a value lifted from the 8192 baseline (the
  # 8K pin truncated 23-min transcripts in RUN_SMOKE #1). All three rungs'
  # underlying models support 65k+ output (ceilings per
  # external_services.yaml). Other Pass 2a stages (audio /
  # presentation / text) keep the 8192 pin — DD-2.4-H stays live sprint-
  # wide; video Pass 2a is lifted "as a class" per the optional clause
  # ratified in task-2.4.12 and preserved here.
  video_pass_2a_mapping:
    prompt_ref: "prompts/video_pass_2a_mapping/v1.md"
    requires: [structured_output]
    ladder:
      - provider: deepseek_thinking
        model: deepseek-v4-pro
        max_output_tokens: 65536
      - provider: dashscope
        model: qwen3.7-max
        max_output_tokens: 65536
      - provider: gemini
        model: gemini-2.5-pro
        max_output_tokens: 65536

  # Pass 2c selective denoise (KD2d + KD8/KD-2.3-X; task 2.4.7).
  # Input: one noisy transcript segment per call — ``content`` (raw slice) +
  #   the Pass 2a metadata (``title`` / ``description`` / concepts) via Jinja
  #   render context; image bytes do NOT flow here (text-cleanup, not vision).
  # Output: a single plain-text string (NOT JSON) — the cleaned transcript —
  #   wrapped into ``AudioPass2cResult.content`` (reused, KD-2.2-I) by the
  #   ``_denoise_segment`` response_validator; a ``ValidationError`` →
  #   ``StructuralRetryError`` (one retry → fallback), symmetric with audio.
  # Invocation site: ``video_pipeline.steps._denoise_segment`` (one call per
  #   noisy segment, ``asyncio.gather`` over the subset inside step_7, which
  #   ``VideoProcessor.process_detail`` runs with the injected stage_router).
  #
  # Ladder rationale (text-cleanup; mechanism CI-landed, ranking is the
  # operator-run RUN_SMOKE spike per KD8/KD-2.3-X — calibrated *within* the
  # registered cheap-tier pool, a separate calibration unit from audio Pass 2c
  # (own ladder + prompt) so a video re-rank cannot silently perturb the
  # production audio denoise). Seed mirrors the audio Pass 2c pool (denoise is
  # cheaper than Pass 2a mapping — bounded output, editorial not generative):
  #   1. gemini/gemini-3.1-flash-lite — cost-first primary (audio Pass 2c rung).
  #   2. gemini/gemini-2.5-flash — second tier.
  #   3. anthropic/claude-haiku-4-5-20251001 — provider-diverse deep fallback.
  # Per-rung ``max_output_tokens: 8192`` pins the output budget rung-uniform
  # (mirrors Pass 1 / Pass 2a). Probe (2026-05-23): the StageRouter calls
  # providers directly (NOT the legacy ModelRouter chain), so an unpinned rung
  # sends ``max_tokens=None`` — gemini then uses its implicit model default and
  # anthropic falls back to its own provider default (8192). Those diverge per
  # provider; the explicit pin makes the output budget identical and explicit on
  # every rung, so a truncated denoise can't hide behind a silent per-provider
  # default (the Pass 1 / 2a rationale). 8192 comfortably covers a single
  # segment's cleaned transcript (~15 min ≈ 3.5k tokens). NB: there is no 4096
  # cap on these rungs — 4096 is the DashScope default and Pass 2c has no
  # DashScope rung. All three are registered in external_services.yaml.
  video_pass_2c_denoise:
    prompt_ref: "prompts/video_pass_2c_denoise/v1.md"
    ladder:
      - provider: gemini
        model: gemini-3.1-flash-lite
        max_output_tokens: 8192
      - provider: gemini
        model: gemini-2.5-flash
        max_output_tokens: 8192
      - provider: anthropic
        model: claude-haiku-4-5-20251001
        max_output_tokens: 8192
