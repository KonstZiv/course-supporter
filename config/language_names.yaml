# ============================================================
# Native language names (mentor-rebuild task 04).
# ============================================================
#
# What a language calls itself, for the language list the author app and the
# student portal read. Every value comes from CLDR through ``babel`` — the real
# i18n source ``DD-2.4-L`` asks for — and NOT from a hand-written table: a
# hand-written one is the debt itself. ``iso639`` carries no native names at
# all, which is why this file exists.
#
# Each value is what CLDR answers to ``get_language_name()`` for that code: the
# language's own name, without the territory or script qualifier its full
# display name would append (``українська``, not ``українська (Україна)``).
#
# ONE entry is a named exception, with its reason beside it. There is no second:
# a value that had to be corrected by hand would mean this file had started
# becoming the hand-written table, and that is a stop, not a quiet edit.
# ``tests/unit/test_language_names.py`` asks CLDR again for every code and
# allows a difference only for the one named below.
#
# Sorted by code. The set of codes matches ``config/languages.yaml`` both ways,
# checked by the same test.

ara:
  name_en: Arabic
  name_native: العربية
