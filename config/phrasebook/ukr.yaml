# ============================================================
# Phrase templates — the source (mentor-rebuild task 04).
# ============================================================
#
# Ukrainian is the source every other language is translated from: the
# translation script reads this file and writes one file per language beside
# it. Editing a phrase here means running the script again in the same commit —
# the discipline a schema change carries with its migration (§2.13 of
# ``03-BINDING.md``).
#
# Every key here is one the review structure of version 1 renders today — but
# the ``reply.*`` words of task 12a (K4) at the end, which the explanation
# stage and the review's builder write into a review's replies as their text. A phrase a
# later stage will need is added by that task: each key costs sixty
# translations.
#
# NO PHRASE COUNTS ANYTHING. A counted phrase ("3 remarks") needs plural
# categories, and they differ per language — Ukrainian has three, Arabic five,
# Japanese none — which one key holding one phrase cannot express (ratified
# 2026-09-17). Should the structure ever need a number inside a sentence, that
# is a change of this format, not another key.
#
# ``{time}``, ``{number}``, ``{name}``, ``{attempt}``, ``{score}`` and
# ``{threshold}`` are filled by the assembler, ``{course}`` by the explanation
# stage with the student's replies (task 12a, K4); a translation carries them
# through unchanged.

# --- The verdict (structure section 1: passed or not, and why) ---
verdict.passed: Зараховано
verdict.failed: Не зараховано

# --- A test (structure section 2: the score, then every question) ---
section.test: Питання тесту
test.question: Питання {number}
test.correct: Правильно
test.incorrect: Неправильно
test.correct_answer: Правильна відповідь
test.score: "Бал: {number} %"
test.try_again: Спробуйте пройти тест ще раз.
test.no_explanation: Пояснення до цього питання немає.
test.explanations_in_course_language: Пояснення подано мовою курсу.

# --- Section headings (structure sections 3-10, in that order) ---
section.fixed: Виправлено
section.new_remarks: Нові зауваження
section.open: Лишилося відкритим
section.broken: Зламалося
section.mentor_voice: Від Ментора
section.replies: Відповіді на ваші репліки
section.verification: Як перевірено
section.progress: Ваш прогрес

# --- One remark, in the contrast form of 2.13 (sections 4, 5 and 6) ---
remark.what: Що не так
remark.why: Чому це важливо
remark.todo: Що зробити
remark.read: Де почитати

# --- What was checked by running it, and what by reading (section 9) ---
verification.by_run: Перевірено запуском
verification.by_reading: Перевірено читанням

# --- The student's own replies, and the answer to each (section 8) ---
reply.kind.question: Ваше питання
reply.kind.objection: Ваше заперечення
reply.kind.comment: Ваш коментар
reply.answer: Відповідь

# --- Where to read: the place inside the material (remark.read) ---
position.video: відео, {time}
position.audio: аудіо, {time}
position.slide: слайд {number}
position.paragraph: абзац {number}
position.file: файл {name}

# --- A course link to a place the course reaches later than the task (task 10) ---
link.later_in_course: Докладніше — далі в курсі

# --- The document itself: the markdown the webhook and the bridge page carry ---
review.title: Рецензія

# --- The same work again: an earlier attempt's review repeated (task 13) ---
# Opens the review, before the verdict. ``{attempt}`` is the number of the
# attempt repeated — a name for it, like ``test.question``'s, not a count.
review.unchanged: Робота не змінилась із попередньої спроби (спроба {attempt}), тому рецензію повторено без нової перевірки.

# --- Why the verdict of a criteria list is what it is (2026-11-12) ---
# Printed under the verdict, before its reason; one per branch of the pass
# rule (``criteria_verdicts.pass_decision``). The wording is the product
# owner's, ratified 2026-11-12. ``{score}`` and ``{threshold}`` are whole
# percent, numbers inside a sentence — so, as the note at the top of this file
# asks, no word in them agrees with the number: the score reads "{score} зі
# 100", and a translation uses its own "out of 100" (second edit, 2026-11-12).
verdict.rule.author_musts_met: Ви виконали всі обов'язкові критерії автора й отримали {score} зі 100. Для завдань з обов'язковими критеріями автора поріг заліку — {threshold}, тож роботу зараховано.
verdict.rule.author_musts_unmet: Не виконано обов'язкові критерії автора, тому роботу не зараховано. Ваш бал — {score} зі 100.
verdict.rule.author_musts_below_threshold: Ви виконали всі обов'язкові критерії автора, але отримали {score} зі 100 — нижче за поріг {threshold} для завдань з обов'язковими критеріями автора, тож роботу не зараховано.
verdict.rule.no_author_musts_passed: Автор не затвердив обов'язкових критеріїв для цього завдання. Для таких завдань поріг заліку — {threshold} зі 100; ваш бал — {score}, тож роботу зараховано.
verdict.rule.no_author_musts_failed: Автор не затвердив обов'язкових критеріїв для цього завдання. Для таких завдань поріг заліку — {threshold} зі 100; ваш бал — {score}, тож роботу не зараховано.

# --- The answers to the student's replies (task 12a, K4) ---
# ``reply.work_only`` — the rule in one sentence: only the work is graded. The
# Mentor's joke on a hostile reply must carry it word for word (the code checks
# it, ``verdict_explanation.joke_faults``), so a translation is ONE plain
# sentence too. ``reply.hostile.fallback`` — the answer to a hostile reply when
# the joke fails that check; it carries ``reply.work_only`` word for word.
# ``reply.off_topic.wrap_up`` — the answer from the fourth round off the topic,
# without a model, and the copy's answer to a reply off the topic; the
# wording is the product owner's (2026-11-17: "Розмови коштують грошей" — the
# check is sometimes paid by the course's author, not the student);
# ``{course}`` is the course's name. ``reply.said.withheld`` — what the
# review's section of replies shows in place of a hostile reply's text: a
# review is read by the school's own systems too.
reply.work_only: Оцінюємо лише саму роботу — файли з розв'язком, а не те, що написано поруч.
reply.hostile.fallback: Цікавий хід! Оцінюємо лише саму роботу — файли з розв'язком, а не те, що написано поруч. Щоб покращити результат, доопрацюйте розв'язок за зауваженнями цієї рецензії.
reply.off_topic.wrap_up: "Про це можна говорити довго, але на нас чекає робота, і час краще витратити на курс «{course}». Розмови коштують грошей: я готовий спілкуватися вічно, але звичайний чат-бот зробить це дешевше, а зі мною краще вчити «{course}»."
reply.said.withheld: (текст цієї репліки в рецензії не наводимо)
