# Submission paths of the rebuilt Mentor (mentor-rebuild task 02).
#
# A path is the list of stages one submission goes through, chosen by the pair
# "assignment type x submission state". Every stage is defined once under
# `stages` and a path lists stage names; a stage that needs different ceilings
# on another path gets another name. Shape and checks: homework/path_config.py.
# The file routes every submission: a type served by `new_path` walks the path
# its submission state selects (homework/path_selection.py, path_runner.py);
# `todays_mentor` leaves the type with today's Mentor. Read once at startup,
# after the checks pass, so an edit takes effect on the next start.
#
# Submission states: first | repeat_without_replies | repeat_with_replies.
# `repeat_with_replies` is described but unreachable until student replies
# exist as records (task 12); until then both repeat states list the same
# stages — a prepared place, not a duplicate.

stages:
  # Model safety check of the student's submission. Starting content is a copy
  # of the `safety_check` ladder in ladders_mentor.yaml (DD-SP-AM: the two copies
  # are calibrated separately while today's Mentor lives).
  safety:
    deterministic: true
    # Router-facing fields, copied from `safety_check` in ladders_mentor.yaml
    # together with the ladder (DD-SP-AM: two calibrated copies while today's
    # Mentor lives). The name differs on purpose — a path stage may not reuse a
    # ladder stage's name, because the call register keys a call's cost on it.
    prompt_ref: "prompts/safety_check/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    record_output: false
    ceilings:
      tool_steps: 0
      # Output is a short structured verdict, so 8192 is ample. A rung with
      # max_output_tokens: null is sent with this ceiling and priced by it:
      # homework/path_stages.py::_execution pins it on the rung, because the
      # router alone would take the registry's cap (65536 for the third rung).
      output_tokens: 8192
      # не калібровано: rung gemini/gemini-3.5-flash-lite (since 2026-09-30,
      # was gemini-2.5-flash: 404 for our key; same $0.30 / $2.50 per 1M),
      # 65536 input + 8192 output tokens = $0.0401 (the dearest single
      # attempt), rounded up. The input is the submission text budget: 131072
      # characters at 2 characters a token.
      # The ceiling is the budget of the whole ladder, not of one attempt: the
      # router takes each called rung's estimate off what is left
      # (llm/stage_router.py::execute_stage), so after rungs 1 and 2 were
      # called and failed, the third rung may be skipped by money on a large
      # submission.
      money_usd: 0.05
    ladder:
      - provider: mistral
        model: mistral-small-latest
        reasoning: null
        max_output_tokens: null
      - provider: deepseek
        model: deepseek-flash
        reasoning: null
        max_output_tokens: 8192
      - provider: gemini
        model: gemini-3.5-flash-lite
        reasoning: null
        max_output_tokens: null

  # "Does this look like an attempt at the task?" — run on a first submission
  # only. Starting content is a copy of the `sanity_check` ladder in
  # ladders_mentor.yaml (DD-SP-AM).
  attempt_classifier:
    deterministic: true
    # Copied from `sanity_check` in ladders_mentor.yaml, as above.
    prompt_ref: "prompts/sanity_check/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    record_output: false
    ceilings:
      tool_steps: 0
      # As on `safety`: a rung with max_output_tokens: null is sent with and
      # priced by this ceiling, not the registry's cap.
      output_tokens: 8192
      # не калібровано: rung gemini/gemini-3.5-flash-lite (since 2026-09-30,
      # was gemini-2.5-flash: 404 for our key; same $0.30 / $2.50 per 1M),
      # 65536 input + 8192 output tokens = $0.0401 (the dearest single
      # attempt), rounded up. The input is
      # the submission text budget: 131072 characters at 2 characters a token.
      # A budget of the whole ladder, not of one attempt, as on `safety`.
      money_usd: 0.05
    ladder:
      - provider: mistral
        model: mistral-small-latest
        reasoning: null
        max_output_tokens: null
      - provider: deepseek
        model: deepseek-flash
        reasoning: null
        max_output_tokens: 8192
      - provider: gemini
        model: gemini-3.5-flash-lite
        reasoning: null
        max_output_tokens: null

  # Verdicts on the criteria of a text task (mentor-rebuild task 09b): one
  # request about the whole list, one repeat about the verdicts that cannot
  # stand, on the rung that answered (homework/criteria_evaluation.py). Not on
  # any path yet: the paths of `task` and `short_task` take it in commit K6.
  criteria_evaluation:
    # The same input twice must give the same verdicts (TASK.md lock 9);
    # qwen3.7-max answered byte for byte the same on the same input, live.
    deterministic: true
    prompt_ref: "prompts/criteria_evaluation/v1.md"
    # The answer goes out with its schema (task 09a): strict on qwen3.7-max,
    # which holds one, JSON mode on DeepSeek, which answers 400 to a schema.
    requires: [json_mode]
    input_budget_ratio: 0.5
    # Quotes of students' work stay out of the call register.
    record_output: false
    ceilings:
      tool_steps: 0
      # The DeepSeek rung's pin, below. On deepseek_thinking the reasoning is
      # counted inside max_output_tokens: at 8192 a rung of the 1A stage with
      # 37 criteria answered an EMPTY body (ladders_mentor.yaml), and on a path
      # stage an empty answer at the ceiling is a stop without descent
      # (PRE-FLIGHT.md 9.6 (a), ratified 2026-10-01).
      output_tokens: 32768
      # не калібровано (PRE-FLIGHT.md 9.6, ratified 2026-10-01). The sum of the
      # dearest attempts of the stage at its largest realistic input — about
      # 56 021 tokens: the work at its budget of 131 072 characters, a task of
      # ~20 000 characters, a list of 37 criteria, the prompt — at the registry
      # rates (config/external_services.yaml, read 2026-10-01):
      #   qwen3.7-max, 16 384 out:            56 021 x 0.00165/1k + 16 384 x 0.004951/1k = 0.173551
      #   deepseek-v4-pro, 32 768 out:        56 021 x 0.00066/1k + 32 768 x 0.00198/1k  = 0.101854
      #   the repeat on qwen3.7-max:                                                        0.173551
      #   qwen's reasoning, 10 000 tokens on each of its two requests: 2 x 0.049510      = 0.099020
      #   total 0.547976, rounded up.
      # Why the reserve for qwen's reasoning: it is not bounded by the output
      # ceiling, and the router's estimate of an attempt does not count it
      # (DD-SP-CM). Measured live after task 09a (sprint/cloud/pr-592/
      # POST-MERGE-LIVE.md, 2026-10-02): at an output ceiling of 16 the
      # estimate for qwen3.7-max was $0.000281 against $0.002905 actually
      # billed — 10.3 times under; at a ceiling of 512 the two were close. The
      # number above stands until the measurement of this stage calibrates it.
      # DeepSeek is priced off-peak; peak hours bill twice that (DD-SP-BG).
      money_usd: 0.55
    ladder:
      # PRE-PLAN.md decision 8: qwen3.7-max first — a strict schema on the
      # wire and the same answer to the same input, measured live.
      - provider: dashscope
        model: qwen3.7-max
        reasoning: null
        max_output_tokens: 16384
      # The fallback, with its reasoning on: the pin leaves room for the
      # reasoning that shares it with the answer.
      - provider: deepseek_thinking
        model: deepseek-v4-pro
        reasoning: null
        max_output_tokens: 32768

  # The verdicts of a text task, explained to its student (mentor-rebuild task
  # 09b, PRE-PLAN.md decision 13): one request; an answer that contradicts the
  # code's facts is retried with the reason (homework/review_explanation.py).
  # Not on any path yet: the paths of `task` and `short_task` take it in K6.
  review_explanation:
    # Nothing downstream needs the same text twice: what must not change — the
    # verdicts, the score, the pass — is the code's, and the text is checked
    # against it on every answer.
    deterministic: false
    prompt_ref: "prompts/review_explanation/v1.md"
    # The answer goes out with its schema (task 09a): strict on qwen3.7-max,
    # JSON mode on deepseek-flash.
    requires: [json_mode]
    input_budget_ratio: 0.5
    # Quotes of students' work stay out of the call register.
    record_output: false
    ceilings:
      tool_steps: 0
      # PRE-FLIGHT.md 9.7б (ratified 2026-10-01). Neither rung spends the
      # ceiling on reasoning: qwen3.7-max's is not counted in it, and
      # deepseek-flash runs without one.
      output_tokens: 8192
      # не калібровано (PRE-FLIGHT.md 9.7б, ratified 2026-10-01). The dearest
      # attempts at the largest realistic input — the work at its budget of
      # 131 072 characters (37 449 tokens at the router's 3.5 characters a
      # token) and about 6 000 tokens of prompt, task, list and verdicts,
      # 43 449 in all — at the registry rates (config/external_services.yaml,
      # read 2026-10-02):
      #   qwen3.7-max, 8 192 out:    43 449 x 0.00165/1k + 8 192 x 0.004951/1k = 0.112249
      #   deepseek-flash, 8 192 out: 43 449 x 0.00015/1k + 8 192 x 0.0006/1k   = 0.011433
      #   qwen's reasoning, 10 000 tokens:                10 000 x 0.004951/1k = 0.049510
      #   total 0.173192, rounded up.
      # The explanation is also shown the task and the criteria's texts. With
      # the evaluation stage's own assumptions — a task of ~20 000 characters
      # and a list of 37 criteria, about 16 286 tokens more (59 735 in all) —
      # the two attempts come to 0.139121 + 0.013875 = 0.152997: both rungs
      # stay reachable under the ceiling (the router skips a rung by its
      # estimate alone), and 0.027003 of the reserve for qwen's reasoning is
      # left (DD-SP-CM). The measurement of this stage calibrates the number.
      # DeepSeek is priced off-peak; peak hours bill twice that (DD-SP-BG).
      money_usd: 0.18
    ladder:
      # PRE-FLIGHT.md 9.7б: qwen3.7-max writes today's texts for students (the
      # first rung of today's synthesis) and answers the same input byte for
      # byte the same; gemini-3.8-flash, today's second, counts its reasoning
      # inside the ceiling, and an empty answer at the ceiling stops a path
      # stage without descent.
      - provider: dashscope
        model: qwen3.7-max
        reasoning: null
        max_output_tokens: 8192
      # The cheap fallback, without reasoning.
      - provider: deepseek
        model: deepseek-flash
        reasoning: null
        max_output_tokens: 8192

task_types:
  # A test makes no model call on any path. On the new path since task 07:
  # answered with its answers and scored against the author's key
  # (homework/test_result.py); `todays_mentor` here is the way back.
  test:
    served_by: new_path
    paths:
      first: []
      repeat_without_replies: []
      repeat_with_replies: []

  # Declared with its switch; no path is described yet.
  short_task:
    served_by: todays_mentor
    paths: {}

  task:
    served_by: todays_mentor
    paths:
      first: [safety, attempt_classifier]
      repeat_without_replies: [safety]
      repeat_with_replies: [safety]

  project:
    served_by: todays_mentor
    paths:
      first: [safety, attempt_classifier]
      repeat_without_replies: [safety]
      repeat_with_replies: [safety]
