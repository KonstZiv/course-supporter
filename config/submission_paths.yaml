# Submission paths of the rebuilt Mentor (mentor-rebuild task 02).
#
# A path is the list of stages one submission goes through, chosen by the pair
# "assignment type x submission state". Every stage is defined once under
# `stages` and a path lists stage names; a stage that needs different ceilings
# on another path gets another name. A stage is of one of two kinds: a model
# stage (ladder, prompt, ceilings) or a code stage (`code: true` and
# `deterministic`, nothing else — task 10). Shape and checks:
# homework/path_config.py.
# The file routes every submission: a type served by `new_path` walks the path
# its submission state selects (homework/path_selection.py, path_runner.py);
# `todays_mentor` leaves the type with today's Mentor. `test_mode: true` beside
# `served_by: new_path` marks a type served by the new path without charging
# for it (path_config.in_test_mode; absent means charged as usual). Read once
# at startup, after the checks pass, so an edit takes effect on the next start.
#
# Submission states: first | repeat_without_replies | repeat_with_replies.
# `repeat_with_replies` is described but unreachable until student replies
# exist as records (task 12); until then both repeat states list the same
# stages — a prepared place, not a duplicate.

stages:
  # Model safety check of the student's submission. Starting content is a copy
  # of the `safety_check` ladder in ladders_mentor.yaml (DD-SP-AM: the two copies
  # are calibrated separately while today's Mentor lives).
  safety:
    deterministic: true
    # Router-facing fields, copied from `safety_check` in ladders_mentor.yaml
    # together with the ladder (DD-SP-AM: two calibrated copies while today's
    # Mentor lives). The name differs on purpose — a path stage may not reuse a
    # ladder stage's name, because the call register keys a call's cost on it.
    prompt_ref: "prompts/safety_check/v2.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    record_output: false
    ceilings:
      tool_steps: 0
      # Output is a short structured verdict, so 8192 is ample. A rung with
      # max_output_tokens: null is sent with this ceiling and priced by it:
      # homework/path_stages.py::_execution pins it on the rung, because the
      # router alone would take the registry's cap (65536 for the third rung).
      output_tokens: 8192
      # не калібровано: rung gemini/gemini-3.5-flash-lite (since 2026-09-30,
      # was gemini-2.5-flash: 404 for our key; same $0.30 / $2.50 per 1M),
      # 65536 input + 8192 output tokens = $0.0401 (the dearest single
      # attempt), rounded up. The input is the submission text budget: 131072
      # characters at 2 characters a token.
      # The ceiling is the budget of the whole ladder, not of one attempt: the
      # router takes each called rung's estimate off what is left
      # (llm/stage_router.py::execute_stage), so after rungs 1 and 2 were
      # called and failed, the third rung may be skipped by money on a large
      # submission.
      money_usd: 0.05
    ladder:
      - provider: mistral
        model: mistral-small-latest
        reasoning: null
        max_output_tokens: null
      - provider: deepseek
        model: deepseek-flash
        reasoning: null
        max_output_tokens: 8192
      - provider: gemini
        model: gemini-3.5-flash-lite
        reasoning: null
        max_output_tokens: null

  # "Does this look like an attempt at the task?" — run on a first submission
  # only. Starting content is a copy of the `sanity_check` ladder in
  # ladders_mentor.yaml (DD-SP-AM).
  attempt_classifier:
    deterministic: true
    # Copied from `sanity_check` in ladders_mentor.yaml, as above.
    prompt_ref: "prompts/sanity_check/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    record_output: false
    ceilings:
      tool_steps: 0
      # As on `safety`: a rung with max_output_tokens: null is sent with and
      # priced by this ceiling, not the registry's cap.
      output_tokens: 8192
      # не калібровано: rung gemini/gemini-3.5-flash-lite (since 2026-09-30,
      # was gemini-2.5-flash: 404 for our key; same $0.30 / $2.50 per 1M),
      # 65536 input + 8192 output tokens = $0.0401 (the dearest single
      # attempt), rounded up. The input is
      # the submission text budget: 131072 characters at 2 characters a token.
      # A budget of the whole ladder, not of one attempt, as on `safety`.
      money_usd: 0.05
    ladder:
      - provider: mistral
        model: mistral-small-latest
        reasoning: null
        max_output_tokens: null
      - provider: deepseek
        model: deepseek-flash
        reasoning: null
        max_output_tokens: 8192
      - provider: gemini
        model: gemini-3.5-flash-lite
        reasoning: null
        max_output_tokens: null

  # Verdicts on the criteria of a text task (mentor-rebuild task 09b): one
  # request about the whole list, one repeat about the verdicts that cannot
  # stand, on the rung that answered (homework/criteria_evaluation.py). On
  # every path of `task` and `short_task`.
  criteria_evaluation:
    # The same input twice must give the same verdicts (TASK.md lock 9);
    # qwen3.7-max answered byte for byte the same on the same input, live.
    deterministic: true
    prompt_ref: "prompts/criteria_evaluation/v1.md"
    # The answer goes out with its schema (task 09a): strict on qwen3.7-max,
    # which holds one, JSON mode on DeepSeek, which answers 400 to a schema.
    requires: [json_mode]
    input_budget_ratio: 0.5
    # Quotes of students' work stay out of the call register.
    record_output: false
    ceilings:
      tool_steps: 0
      # The DeepSeek rung's pin, below. On deepseek_thinking the reasoning is
      # counted inside max_output_tokens: at 8192 a rung of the 1A stage with
      # 37 criteria answered an EMPTY body (ladders_mentor.yaml), and on a path
      # stage an empty answer at the ceiling is a stop without descent
      # (PRE-FLIGHT.md 9.6 (a), ratified 2026-10-01).
      output_tokens: 32768
      # не калібровано (PRE-FLIGHT.md 9.6, ratified 2026-10-01). The sum of the
      # dearest attempts of the stage at its largest realistic input — about
      # 56 021 tokens: the work at its budget of 131 072 characters, a task of
      # ~20 000 characters, a list of 37 criteria, the prompt — at the registry
      # rates (config/external_services.yaml, read 2026-10-01):
      #   qwen3.7-max, 16 384 out:            56 021 x 0.00165/1k + 16 384 x 0.004951/1k = 0.173551
      #   deepseek-v4-pro, 32 768 out:        56 021 x 0.00066/1k + 32 768 x 0.00198/1k  = 0.101854
      #   the repeat on qwen3.7-max:                                                        0.173551
      #   qwen's reasoning, 10 000 tokens on each of its two requests: 2 x 0.049510      = 0.099020
      #   total 0.547976, rounded up.
      # Why the reserve for qwen's reasoning: it is not bounded by the output
      # ceiling, and the router's estimate of an attempt does not count it
      # (DD-SP-CM). Measured live after task 09a (sprint/cloud/pr-592/
      # POST-MERGE-LIVE.md, 2026-10-02): at an output ceiling of 16 the
      # estimate for qwen3.7-max was $0.000281 against $0.002905 actually
      # billed — 10.3 times under; at a ceiling of 512 the two were close. The
      # number above stands until the measurement of this stage calibrates it.
      # DeepSeek is priced off-peak; peak hours bill twice that (DD-SP-BG).
      money_usd: 0.55
    ladder:
      # PRE-PLAN.md decision 8: qwen3.7-max first — a strict schema on the
      # wire and the same answer to the same input, measured live.
      - provider: dashscope
        model: qwen3.7-max
        reasoning: null
        max_output_tokens: 16384
      # The fallback, with its reasoning on: the pin leaves room for the
      # reasoning that shares it with the answer.
      - provider: deepseek_thinking
        model: deepseek-v4-pro
        reasoning: null
        max_output_tokens: 32768

  # The places of the course that explain the criteria the student failed
  # (mentor-rebuild task 10, K5): code alone — the course-link finder over the
  # criteria's concepts (homework/course_links.py). No model is called and
  # nothing is paid for. On every path of `task` and `short_task`, between the
  # verdicts and their explanation, which is shown what it found.
  course_link_lookup:
    code: true
    # The same verdicts and the same course give the same places.
    deterministic: true

  # The verdicts of a text task, explained to its student (mentor-rebuild task
  # 09b, PRE-PLAN.md decision 13): one request; an answer that contradicts the
  # code's facts is retried with the reason (homework/review_explanation.py).
  # Since task 10 (K5) it is also shown the places `course_link_lookup` found
  # and names the ones it points to; a place it was not shown is cut, never
  # retried. Last on every path of `task` and `short_task`: the review is laid
  # out from its answer and the verdicts (homework/text_result.py).
  review_explanation:
    # Nothing downstream needs the same text twice: what must not change — the
    # verdicts, the score, the pass — is the code's, and the text is checked
    # against it on every answer.
    deterministic: false
    # v3 (2026-11-13): no rule of the pass — the review's builder prints the
    # pass and its rule since 12.11, and v2 still told the model that an unmet
    # `must` decides it; one form of address, no account of how the check
    # works, nothing put into the mouth of the course, never the solution.
    # The same variables and slots as v2, so the user message is byte for byte
    # v2's. v2 (task 10, K5: the course links) and v1 stay beside it as
    # history.
    prompt_ref: "prompts/review_explanation/v3.md"
    # The answer goes out with its schema (task 09a): strict on qwen3.7-max,
    # JSON mode on deepseek-flash.
    requires: [json_mode]
    input_budget_ratio: 0.5
    # Quotes of students' work stay out of the call register.
    record_output: false
    ceilings:
      tool_steps: 0
      # PRE-FLIGHT.md 9.7б (ratified 2026-10-01). Neither rung spends the
      # ceiling on reasoning: qwen3.7-max's is not counted in it, and
      # deepseek-flash runs without one.
      output_tokens: 8192
      # не калібровано (PRE-FLIGHT.md 9.7б, ratified 2026-10-01; recounted for
      # prompt v2 in task 10, K5, and for prompt v3 on 2026-11-13). The
      # dearest attempts at the largest realistic input, at the router's 3.5
      # characters a token:
      #   the work at its budget of 131 072 characters             37 449
      #   prompt v1, task of ~20 000 characters, a list of 37
      #   criteria and their verdicts — the evaluation stage's
      #   own assumptions (09b)                                     22 286
      #   prompt v2 over v1: 7 875 - 6 293 = 1 582 characters          452
      #   <course_links>: all 37 criteria not met, 3 places each,
      #   a place an excerpt of 300 characters, a title of 120,
      #   its id and position, as the slot's JSON — 58 905
      #   characters, measured on that worst case                   16 830
      #   prompt v3 over v2: 9 182 - 7 846 = 1 336 characters          382
      #   in all                                                    77 399
      # at the registry rates (config/external_services.yaml, read 2026-11-13):
      #   qwen3.7-max, 8 192 out:    77 399 x 0.00165/1k + 8 192 x 0.004951/1k = 0.168267
      #   deepseek-flash, 8 192 out: 77 399 x 0.00015/1k + 8 192 x 0.0006/1k   = 0.016525
      #   qwen's reasoning, 10 000 tokens:                10 000 x 0.004951/1k = 0.049510
      #   total 0.234302, rounded up — the same 0.24 as for v2.
      # Both rungs stay reachable (the router skips a rung by its estimate
      # alone): after the first, 0.071733 is left for the second's 0.016525,
      # and the whole reserve for qwen's reasoning stays in (DD-SP-CM). The
      # previous number, 0.18, was counted for 43 449 tokens without the task
      # and the list; the list's links scale with the list, so the 37-criteria
      # assumption enters the sum itself now. The measurement of this stage
      # calibrates the number. DeepSeek is priced off-peak; peak hours bill
      # twice that (DD-SP-BG).
      money_usd: 0.24
    ladder:
      # PRE-FLIGHT.md 9.7б: qwen3.7-max writes today's texts for students (the
      # first rung of today's synthesis) and answers the same input byte for
      # byte the same; gemini-3.8-flash, today's second, counts its reasoning
      # inside the ceiling, and an empty answer at the ceiling stops a path
      # stage without descent.
      - provider: dashscope
        model: qwen3.7-max
        reasoning: null
        max_output_tokens: 8192
      # The cheap fallback, without reasoning.
      - provider: deepseek
        model: deepseek-flash
        reasoning: null
        max_output_tokens: 8192

  # Verdicts on the criteria of a project (project chain K4): the executor of
  # `criteria_evaluation` under its own name and with its own prompt, which
  # tells the model the frames of a project's delta context — the platform's
  # trusted block, the student's NEW / CHANGED files, the author's NEIGHBOR
  # files — and that a quote of the author's code does not count. The work is
  # the student's files and the base is the author's (chain K3), from the
  # project's door. Ladder, flags, ratio and output ceiling as on
  # `criteria_evaluation`. On no path yet: the switch of `project` is a later
  # change, with its own live measurement.
  project_criteria_evaluation:
    deterministic: true
    prompt_ref: "prompts/criteria_evaluation_project/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    record_output: false
    ceilings:
      tool_steps: 0
      output_tokens: 32768
      # не калібровано (project chain K4). The arithmetic of
      # `criteria_evaluation`, at the project's largest realistic input. The
      # project's door refuses a delta context over its budget before any
      # call; on the new path that budget is
      # homework/text_budget.py::path_context_budget_chars for `project`:
      # 131 072 characters — the first rung of `safety` (mistral-small-latest,
      # a window of 131 072 tokens, ratio 0.5, 2 characters a token) bounds
      # it, with this stage on the path or without it — the same work budget
      # the text stage counted. So the text stage's input, and the longer
      # prompt, at the router's 3.5 characters a token:
      #   the text stage's input: the work at 131 072 characters, a task of
      #   ~20 000 characters, a list of 37 criteria, prompt v1     56 021
      #   this prompt over v1: 7 110 - 4 446 = 2 664 characters       762
      #   in all                                                    56 783
      # at the registry rates (config/external_services.yaml, read 2026-11-13):
      #   qwen3.7-max, 16 384 out:     56 783 x 0.00165/1k + 16 384 x 0.004951/1k = 0.174809
      #   deepseek-v4-pro, 32 768 out: 56 783 x 0.00066/1k + 32 768 x 0.00198/1k  = 0.102357
      #   the repeat on qwen3.7-max:                                                 0.174809
      #   qwen's reasoning, 10 000 tokens on each of its two requests: 2 x 0.049510 = 0.099020
      #   total 0.550996, rounded up.
      # The reserve for qwen's reasoning and the off-peak price of DeepSeek as
      # on `criteria_evaluation` (DD-SP-CM, DD-SP-BG). The measurement of this
      # stage calibrates the number.
      money_usd: 0.56
    ladder:
      - provider: dashscope
        model: qwen3.7-max
        reasoning: null
        max_output_tokens: 16384
      - provider: deepseek_thinking
        model: deepseek-v4-pro
        reasoning: null
        max_output_tokens: 32768

  # The verdicts of a project, explained to its student (project chain K4):
  # the executor of `review_explanation` under its own name and with its own
  # prompt — one form of address, no account of how the check works, no
  # finished solution, nothing put into the mouth of the course, no rule of
  # the pass (the review's builder prints it), and a criterion that fell for
  # the author's code said in plain words. Ladder, flags, ratio and output
  # ceiling as on `review_explanation`. On no path yet, as above.
  project_review_explanation:
    deterministic: false
    prompt_ref: "prompts/review_explanation_project/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    record_output: false
    ceilings:
      tool_steps: 0
      output_tokens: 8192
      # не калібровано (project chain K4). The arithmetic of
      # `review_explanation`, at the project's largest realistic input — the
      # same work budget of 131 072 characters (see the stage above) — at the
      # router's 3.5 characters a token:
      #   the text stage's input: the work, prompt v2, the task,
      #   a list of 37 criteria with their verdicts, the course
      #   links of all 37 not met                                    77 017
      #   this prompt over v2: 10 633 - 7 846 = 2 787 characters        797
      #   `"quote_from_base": true` on all 37 not met: 37 x 25
      #   = 925 characters of the verdicts' JSON                       265
      #   in all                                                    78 079
      # at the registry rates (config/external_services.yaml, read 2026-11-13):
      #   qwen3.7-max, 8 192 out:    78 079 x 0.00165/1k + 8 192 x 0.004951/1k = 0.169389
      #   deepseek-flash, 8 192 out: 78 079 x 0.00015/1k + 8 192 x 0.0006/1k   = 0.016627
      #   qwen's reasoning, 10 000 tokens:                10 000 x 0.004951/1k = 0.049510
      #   total 0.235526, rounded up.
      # Both rungs stay reachable: after the first, 0.070611 is left for the
      # second's 0.016627. The measurement of this stage calibrates the
      # number; DeepSeek is priced off-peak (DD-SP-BG).
      money_usd: 0.24
    ladder:
      - provider: dashscope
        model: qwen3.7-max
        reasoning: null
        max_output_tokens: 8192
      - provider: deepseek
        model: deepseek-flash
        reasoning: null
        max_output_tokens: 8192

task_types:
  # A test makes no model call on any path. On the new path since task 07:
  # answered with its answers and scored against the author's key
  # (homework/test_result.py); `todays_mentor` here is the way back.
  test:
    served_by: new_path
    paths:
      first: []
      repeat_without_replies: []
      repeat_with_replies: []

  # The two text types (mentor-rebuild task 09b): verdicts on the criteria,
  # the places of the course for the failed ones (task 10), their
  # explanation, and the review laid out by code (homework/text_result.py).
  # On the new path in test mode since task 10 (K5): served by the new path,
  # not charged for. Nothing reads test_mode yet — the funds port is
  # AlwaysEnoughFundsPort; the billing adapter will.
  short_task:
    served_by: new_path
    test_mode: true
    paths:
      first:
        [safety, attempt_classifier, criteria_evaluation, course_link_lookup, review_explanation]
      repeat_without_replies:
        [safety, criteria_evaluation, course_link_lookup, review_explanation]
      repeat_with_replies:
        [safety, criteria_evaluation, course_link_lookup, review_explanation]

  task:
    served_by: new_path
    test_mode: true
    paths:
      first:
        [safety, attempt_classifier, criteria_evaluation, course_link_lookup, review_explanation]
      repeat_without_replies:
        [safety, criteria_evaluation, course_link_lookup, review_explanation]
      repeat_with_replies:
        [safety, criteria_evaluation, course_link_lookup, review_explanation]

  project:
    served_by: todays_mentor
    paths:
      first: [safety, attempt_classifier]
      repeat_without_replies: [safety]
      repeat_with_replies: [safety]
