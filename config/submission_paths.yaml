# Submission paths of the rebuilt Mentor (mentor-rebuild task 02).
#
# A path is the list of stages one submission goes through, chosen by the pair
# "assignment type x submission state". Every stage is defined once under
# `stages` and a path lists stage names; a stage that needs different ceilings
# on another path gets another name. A stage is of one of two kinds: a model
# stage (ladder, prompt, ceilings) or a code stage (`code: true` and
# `deterministic`, nothing else — task 10). Shape and checks:
# homework/path_config.py.
# The file routes every submission: a type served by `new_path` walks the path
# its submission state selects (homework/path_selection.py, path_runner.py);
# `todays_mentor` leaves the type with today's Mentor. `test_mode: true` beside
# `served_by: new_path` marks a type served by the new path without charging
# for it (path_config.in_test_mode; absent means charged as usual). Read once
# at startup, after the checks pass, so an edit takes effect on the next start.
#
# Submission states: first | repeat_without_replies | repeat_with_replies.
# `repeat_with_replies` is described but unreachable until student replies
# exist as records (task 12); until then both repeat states list the same
# stages — a prepared place, not a duplicate.

stages:
  # Model safety check of the student's submission. Starting content is a copy
  # of the `safety_check` ladder in ladders_mentor.yaml (DD-SP-AM: the two copies
  # are calibrated separately while today's Mentor lives).
  safety:
    deterministic: true
    # Router-facing fields, copied from `safety_check` in ladders_mentor.yaml
    # together with the ladder (DD-SP-AM: two calibrated copies while today's
    # Mentor lives). The name differs on purpose — a path stage may not reuse a
    # ladder stage's name, because the call register keys a call's cost on it.
    prompt_ref: "prompts/safety_check/v2.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    record_output: false
    ceilings:
      tool_steps: 0
      # Output is a short structured verdict, so 8192 is ample. A rung with
      # max_output_tokens: null is sent with this ceiling and priced by it:
      # homework/path_stages.py::_execution pins it on the rung, because the
      # router alone would take the registry's cap (65536 for the second rung).
      output_tokens: 8192
      # не калібровано: rung gemini/gemini-3.5-flash-lite (since 2026-09-30,
      # was gemini-2.5-flash: 404 for our key; same $0.30 / $2.50 per 1M),
      # 65536 input + 8192 output tokens = $0.0401 (the dearest single
      # attempt), rounded up. The input is the submission text budget: 131072
      # characters at 2 characters a token. Recounted 2026-11-05, when the
      # deepseek-flash rung left this ladder (DeepSeek off the students'
      # texts): the dearest attempt is the same rung, so the number stands.
      # The ceiling is the budget of the whole ladder, not of one attempt: the
      # router takes each called rung's estimate off what is left
      # (llm/stage_router.py::execute_stage). Both rungs at 2 characters a
      # token would sum to 0.014746 + 0.040141 = 0.054887, over the ceiling;
      # but the router admits a rung by its own estimate, at 3.5 characters a
      # token (llm/token_budget.py): the work at its budget and the template
      # of prompts/safety_check/v2.md (8 369 characters) are ~39 840 tokens,
      #   mistral-small-latest:  39 840 x 0.00015/1k + 8 192 x 0.0006/1k = 0.010891
      #   gemini-3.5-flash-lite: 39 840 x 0.0003/1k  + 8 192 x 0.0025/1k = 0.032432
      # so after rung 1 was called and failed, 0.039109 is left for rung 2's
      # 0.032432: the second rung stays reachable on the largest submission.
      money_usd: 0.05
    ladder:
      - provider: mistral
        model: mistral-small-latest
        reasoning: null
        max_output_tokens: null
      - provider: gemini
        model: gemini-3.5-flash-lite
        reasoning: null
        max_output_tokens: null

  # "Does this look like an attempt at the task?" — run on a first submission
  # only. Starting content is a copy of the `sanity_check` ladder in
  # ladders_mentor.yaml (DD-SP-AM).
  attempt_classifier:
    deterministic: true
    # Copied from `sanity_check` in ladders_mentor.yaml, as above.
    prompt_ref: "prompts/sanity_check/v1.md"
    requires: [json_mode]
    input_budget_ratio: 0.5
    record_output: false
    ceilings:
      tool_steps: 0
      # As on `safety`: a rung with max_output_tokens: null is sent with and
      # priced by this ceiling, not the registry's cap.
      output_tokens: 8192
      # не калібровано: rung gemini/gemini-3.5-flash-lite (since 2026-09-30,
      # was gemini-2.5-flash: 404 for our key; same $0.30 / $2.50 per 1M),
      # 65536 input + 8192 output tokens = $0.0401 (the dearest single
      # attempt), rounded up. The input is
      # the submission text budget: 131072 characters at 2 characters a token.
      # Recounted 2026-11-05 without the deepseek-flash rung, as on `safety`:
      # the number stands. A budget of the whole ladder, not of one attempt,
      # as on `safety`; at the router's 3.5 characters a token the work and
      # the template of prompts/sanity_check/v1.md (2 445 characters) are
      # ~38 147 tokens — rung 1 0.010637, rung 2 0.031924, 0.039363 left after
      # rung 1: the second rung stays reachable.
      money_usd: 0.05
    ladder:
      - provider: mistral
        model: mistral-small-latest
        reasoning: null
        max_output_tokens: null
      - provider: gemini
        model: gemini-3.5-flash-lite
        reasoning: null
        max_output_tokens: null

  # Verdicts on the criteria of a text task (mentor-rebuild task 09b): one
  # request about the whole list, one repeat about the verdicts that cannot
  # stand, on the rung that answered (homework/criteria_evaluation.py). On
  # every path of `task` and `short_task`.
  criteria_evaluation:
    # The same input twice must give the same verdicts (TASK.md lock 9).
    # qwen3.7-max, the first rung until 2026-11-05, answered byte for byte the
    # same on the same input, live (task 09a; its record,
    # sprint/cloud/pr-592/POST-MERGE-LIVE.md, is outside this repository).
    # gemini-3.8-flash, its replacement, is NOT measured for it yet: the live
    # measurement of this stage on the new first rung decides whether the
    # flag holds.
    deterministic: true
    prompt_ref: "prompts/criteria_evaluation/v1.md"
    # The answer goes out with its schema (task 09a): strict on
    # gemini-3.8-flash, which holds one (schema_strict, measured live
    # 2026-10-01), JSON mode on mistral-large-2512 (json_mode only).
    requires: [json_mode]
    input_budget_ratio: 0.5
    # Quotes of students' work stay out of the call register.
    record_output: false
    ceilings:
      tool_steps: 0
      # The Gemini rung's pin, below. gemini-3.8-flash counts its reasoning
      # inside max_output_tokens and the connector cannot limit it
      # (config/external_services.yaml) — the fault deepseek_thinking showed
      # on the 1A stage with 37 criteria: at 8192 an EMPTY body
      # (ladders_mentor.yaml). On a path stage an empty answer at the ceiling
      # is a stop without descent (PRE-FLIGHT.md 9.6 (a), ratified
      # 2026-10-01), so the pin keeps the answer room the first rung had —
      # qwen3.7-max's 16 384, its reasoning outside it — plus the 10 000
      # tokens of reasoning the previous ceiling reserved for it:
      # 26 384, rounded up to 32 768, the pin deepseek_thinking carried here.
      output_tokens: 32768
      # не калібровано (method of PRE-FLIGHT.md 9.6, ratified 2026-10-01;
      # recounted 2026-11-05, when Gemini and Mistral replaced Alibaba and
      # DeepSeek). The sum of the dearest attempts of the stage at its largest
      # realistic input — about 56 021 tokens: the work at its budget of
      # 131 072 characters, a task of ~20 000 characters, a list of 37
      # criteria, the prompt — at the registry rates
      # (config/external_services.yaml, catalog 2026-10-30.2, read 2026-11-05):
      #   gemini-3.8-flash, 32 768 out:   56 021 x 0.00075/1k + 32 768 x 0.00375/1k = 0.164896
      #   mistral-large-2512, 8 192 out:  56 021 x 0.0005/1k  + 8 192 x 0.0015/1k   = 0.040299
      #   the repeat on gemini-3.8-flash:                                             0.164896
      #   total 0.370090, rounded up.
      # No reserve for reasoning: Gemini's is inside its pin, so the router's
      # estimate of the attempt already bounds it, and mistral-large-2512 does
      # not reason. (The reserve the previous number held was for qwen3.7-max,
      # whose reasoning is outside the ceiling: DD-SP-CM.) Both rungs stay
      # reachable: after the first, 0.215104 is left for the second's 0.040299.
      # Gemini is at its introductory price, which ends 2026-12-31: at the
      # price from 2027-01-01 ($1.50 / $7.50 per 1M) the Gemini attempt is
      # 0.329792 — still admitted, 0.050208 left for the second rung — but the
      # sum, 0.699882, is not covered: the Gemini price revision (due
      # 2026-12-20) recounts this number. The measurement of this stage
      # calibrates it.
      money_usd: 0.38
    ladder:
      # The strongest Gemini our key can call (2026-11-05): no Gemini of the
      # pro class is — gemini-2.5-pro answers our key 404
      # (config/external_services.yaml) — so gemini-3.8-flash, the model
      # registered on 2026-09-30 to replace it. It holds a strict schema on
      # the wire (task 09a).
      - provider: gemini
        model: gemini-3.8-flash
        reasoning: null
        max_output_tokens: 32768
      # The fallback: the strongest Mistral in the registry, with JSON mode;
      # its 262 144-token window holds the largest input (budget 131 072).
      # Pinned at its registry cap, 8 192 — under the stage ceiling, so the
      # stage's 32 768 must not reach it unpinned; it does not reason, so the
      # whole pin is answer.
      - provider: mistral
        model: mistral-large-2512
        reasoning: null
        max_output_tokens: 8192

  # The places of the course that explain the criteria the student failed
  # (mentor-rebuild task 10, K5): code alone — the course-link finder over the
  # criteria's concepts (homework/course_links.py). No model is called and
  # nothing is paid for. On every path of `task` and `short_task`, between the
  # verdicts and their explanation, which is shown what it found.
  course_link_lookup:
    code: true
    # The same verdicts and the same course give the same places.
    deterministic: true

  # The verdicts of a text task, explained to its student (mentor-rebuild task
  # 09b, PRE-PLAN.md decision 13): one request; an answer that contradicts the
  # code's facts is retried with the reason (homework/review_explanation.py).
  # Since task 10 (K5) it is also shown the places `course_link_lookup` found
  # and names the ones it points to; a place it was not shown is cut, never
  # retried. Last on every path of `task` and `short_task`: the review is laid
  # out from its answer and the verdicts (homework/text_result.py).
  review_explanation:
    # Nothing downstream needs the same text twice: what must not change — the
    # verdicts, the score, the pass — is the code's, and the text is checked
    # against it on every answer.
    deterministic: false
    # v2 (task 10, K5): the slot of course links and the rule on naming them;
    # v1 stays beside it as history.
    prompt_ref: "prompts/review_explanation/v2.md"
    # The answer goes out with its schema (task 09a): strict on
    # gemini-3.8-flash, JSON mode on mistral-small-latest (json_mode only).
    requires: [json_mode]
    input_budget_ratio: 0.5
    # Quotes of students' work stay out of the call register.
    record_output: false
    ceilings:
      tool_steps: 0
      # The Gemini rung's pin, below. PRE-FLIGHT.md 9.7б (ratified
      # 2026-10-01) set 8192 when neither rung spent the ceiling on reasoning
      # (qwen3.7-max's was not counted in it, deepseek-flash ran without one).
      # gemini-3.8-flash counts its reasoning inside max_output_tokens and the
      # connector cannot limit it, and an empty answer at the ceiling stops a
      # path stage without descent — so the answer room of 9.7б, 8 192, plus
      # the 10 000 tokens of reasoning the previous ceiling reserved for qwen:
      # 18 192, rounded up to 32 768 (since 2026-11-05).
      output_tokens: 32768
      # не калібровано (PRE-FLIGHT.md 9.7б, ratified 2026-10-01; recounted for
      # prompt v2 in task 10, K5; recounted 2026-11-05, when Gemini and
      # Mistral replaced Alibaba and DeepSeek). The dearest attempts at the
      # largest realistic input, at the router's 3.5 characters a token:
      #   the work at its budget of 131 072 characters             37 449
      #   prompt v1, task of ~20 000 characters, a list of 37
      #   criteria and their verdicts — the evaluation stage's
      #   own assumptions (09b)                                     22 286
      #   prompt v2 over v1: 7 875 - 6 293 = 1 582 characters          452
      #   <course_links>: all 37 criteria not met, 3 places each,
      #   a place an excerpt of 300 characters, a title of 120,
      #   its id and position, as the slot's JSON — 58 905
      #   characters, measured on that worst case                   16 830
      #   in all                                                    77 017
      # at the registry rates (config/external_services.yaml, catalog
      # 2026-10-30.2, read 2026-11-05):
      #   gemini-3.8-flash, 32 768 out:    77 017 x 0.00075/1k + 32 768 x 0.00375/1k = 0.180643
      #   mistral-small-latest, 8 192 out: 77 017 x 0.00015/1k + 8 192 x 0.0006/1k   = 0.016468
      #   total 0.197111, rounded up.
      # No reserve for reasoning: Gemini's is inside its pin, and
      # mistral-small-latest does not reason (the previous number held 10 000
      # tokens for qwen's, which is outside the ceiling: DD-SP-CM). After the
      # first rung, 0.019357 is left for the second's 0.016468. But the second
      # rung's window is 131 072 tokens, a budget of 65 536 at the ratio 0.5:
      # an input over it — 77 017 here, anything past ~229 000 characters of
      # prompt — skips that rung by the input budget, so at the largest input
      # the stage has one rung. Gemini is at its introductory price, which
      # ends 2026-12-31: at the price from 2027-01-01 ($1.50 / $7.50 per 1M)
      # its attempt here is 0.361286, over this ceiling, and the first rung
      # would be skipped by money at the largest input — the Gemini price
      # revision (due 2026-12-20) recounts this number. The measurement of
      # this stage calibrates it.
      money_usd: 0.20
    ladder:
      # gemini-3.8-flash writes today's texts for students (the second rung
      # of today's synthesis, the first since 2026-11-05) and holds a strict
      # schema on the wire (task 09a). Its reasoning shares the pin with the
      # answer: see the output ceiling above.
      - provider: gemini
        model: gemini-3.8-flash
        reasoning: null
        max_output_tokens: 32768
      # The cheap fallback, without reasoning, with JSON mode; pinned at its
      # registry cap, 8 192, so the stage's 32 768 does not reach it.
      - provider: mistral
        model: mistral-small-latest
        reasoning: null
        max_output_tokens: 8192

task_types:
  # A test makes no model call on any path. On the new path since task 07:
  # answered with its answers and scored against the author's key
  # (homework/test_result.py); `todays_mentor` here is the way back.
  test:
    served_by: new_path
    paths:
      first: []
      repeat_without_replies: []
      repeat_with_replies: []

  # The two text types (mentor-rebuild task 09b): verdicts on the criteria,
  # the places of the course for the failed ones (task 10), their
  # explanation, and the review laid out by code (homework/text_result.py).
  # On the new path in test mode since task 10 (K5): served by the new path,
  # not charged for. Nothing reads test_mode yet — the funds port is
  # AlwaysEnoughFundsPort; the billing adapter will.
  short_task:
    served_by: new_path
    test_mode: true
    paths:
      first:
        [safety, attempt_classifier, criteria_evaluation, course_link_lookup, review_explanation]
      repeat_without_replies:
        [safety, criteria_evaluation, course_link_lookup, review_explanation]
      repeat_with_replies:
        [safety, criteria_evaluation, course_link_lookup, review_explanation]

  task:
    served_by: new_path
    test_mode: true
    paths:
      first:
        [safety, attempt_classifier, criteria_evaluation, course_link_lookup, review_explanation]
      repeat_without_replies:
        [safety, criteria_evaluation, course_link_lookup, review_explanation]
      repeat_with_replies:
        [safety, criteria_evaluation, course_link_lookup, review_explanation]

  project:
    served_by: todays_mentor
    paths:
      first: [safety, attempt_classifier]
      repeat_without_replies: [safety]
      repeat_with_replies: [safety]
