# Mounted read-only over /etc/netdata/netdata.conf by docker-compose.prod.yaml.
# Up to the [db] section: the file that was live in the container on 2026-11-27,
# unchanged. The [db] section bounds the metrics database (Z-22): with the
# defaults (about 1 GiB per tier) it reached 2.3 GB in 17 days on this server.

# netdata can generate its own config which is available at 'http://<IP>:19999/netdata.conf'
# You can download it using:
#    curl -o //etc/netdata/netdata.conf http://localhost:19999/netdata.conf
# or
#    wget -O //etc/netdata/netdata.conf http://localhost:19999/netdata.conf

[db]
    # Bounded metrics database: about 450 MiB in all, on the netdata-cache volume.
    dbengine tier 0 retention size = 256MiB
    dbengine tier 0 retention time = 7d
    dbengine tier 1 retention size = 128MiB
    dbengine tier 1 retention time = 1mo
    dbengine tier 2 retention size = 64MiB
    dbengine tier 2 retention time = 6mo
