# Course Supporter API — nginx config snippet
# Add to existing nginx.conf inside http { } block (do NOT replace existing server blocks)
#
# The live copy of these blocks is in the main nginx.conf of the shared nginx
# container on the server, which is managed in a separate repository. Keep this
# snippet identical to it: a change here is not deployed by deploy.yml.
#
# Prerequisites:
#   1. DNS CNAME: api.pythoncourse.me → pythoncourse.me
#   2. SSL certificate: certbot for api.pythoncourse.me
#   3. course-supporter-app container on shared-net (resolved dynamically via Docker DNS)

# --- Answer while the app container is down (Z-16) ---
#
# During a deploy course-supporter-app is recreated. While it is gone nginx
# cannot reach it and would answer 502 with no body and no CORS headers; the
# browser hides such a response from a page on another origin, and the portal
# and the panel see only "network error". The @service_updating location in the
# HTTPS server below answers that case with a clear 503 instead.
#
# The contract (the portal and the panel build on it; do not change it without
# agreeing with their side):
#   - 503, "Retry-After: 15", body exactly {"detail":"service_updating"},
#     Content-Type: application/json;
#   - CORS headers as the app gives them: Access-Control-Allow-Origin = the
#     request's origin when it is on the list below, plus
#     "Access-Control-Expose-Headers: Retry-After" (without it the browser does
#     not let the page read Retry-After) and "Vary: Origin"; for any other
#     origin, neither of the two Access-Control headers;
#   - a CORS preflight (OPTIONS with Access-Control-Request-Method) gets 204
#     with the app's own CORS headers, so the real request is sent and receives
#     the 503.
#
# KEEP IN SYNC WITH THE APP:
#   - the origin list below = CORS_ALLOWED_ORIGINS in the app's .env.prod;
#   - the methods and headers of the preflight answer = cors_allowed_methods and
#     cors_allowed_headers in src/course_supporter/config.py (plus the headers
#     Starlette always allows: Accept, Accept-Language, Content-Language).
#   - if CORS_ALLOW_CREDENTIALS is ever turned on in the app, add
#     "Access-Control-Allow-Credentials: true" to both answers.
# The map directives must sit in the http { } block, like the server blocks.

# Origin of the request if it is allowed, otherwise empty (an add_header with an
# empty value is not sent at all).
map $http_origin $cs_cors_origin {
    default                           "";
    "https://panel.pythoncourse.me"   $http_origin;
    "https://campus.pythoncourse.me"  $http_origin;
    "https://pythoncourse.me"         $http_origin;
}

# Retry-After must be readable by the page, but only for an allowed origin.
map $cs_cors_origin $cs_cors_expose {
    default  "Retry-After";
    ""       "";
}

# 1 for a CORS preflight: OPTIONS that carries Access-Control-Request-Method.
map "$request_method:$http_access_control_request_method" $cs_is_preflight {
    default        0;
    "~^OPTIONS:.+" 1;
}

# --- Course Supporter API (HTTP → HTTPS redirect + ACME challenge) ---

server {
    listen 80;
    server_name api.pythoncourse.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Course Supporter API (HTTPS) ---

server {
    listen 443 ssl;
    server_name api.pythoncourse.me;

    ssl_certificate /etc/letsencrypt/live/api.pythoncourse.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pythoncourse.me/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Upload body cap: one gibibyte of payload plus a small multipart
    # envelope (~1 KB). 1025m leaves ~1 MiB of headroom so a file of exactly
    # 1 GiB passes; the create route enforces the real per-video upload cap.
    client_max_body_size 1025m;

    # Timeouts for large uploads (1GB @ 10Mbps ~ 14 min)
    client_body_timeout 900s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Stream uploads directly to upstream (no disk buffering)
    proxy_request_buffering off;

    # Docker DNS — resolve at request time, not at startup
    # Allows nginx to start even if course-supporter-app is not running yet
    resolver 127.0.0.11 valid=30s;
    set $course_supporter http://course-supporter-app:8000;
    set $netdata_backend http://netdata:19999;

    location / {
        proxy_pass $course_supporter;

        # Only the error nginx itself makes because the app is not there:
        # 502 (connection refused, or the container name no longer resolves in
        # Docker DNS). Not 504: a timeout means the app is alive and may already
        # be executing the request, and "repeat unchanged" could then duplicate
        # it. No proxy_intercept_errors: a 5xx the app sends itself passes
        # through unchanged.
        error_page 502 = @service_updating;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security headers
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- The app is down or restarting: see the contract at the top ---
    location @service_updating {
        default_type application/json;

        # Preflight: 204 with the app's own CORS headers. add_header inside the
        # if block replaces the outer set, so Retry-After and the expose header
        # are not sent here.
        if ($cs_is_preflight) {
            add_header Access-Control-Allow-Origin $cs_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH" always;
            add_header Access-Control-Allow-Headers "Accept, Accept-Language, Authorization, Content-Language, Content-Type, X-API-Key" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary "Origin, Access-Control-Request-Method, Access-Control-Request-Headers, Access-Control-Request-Private-Network" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            return 204;
        }

        add_header Retry-After 15 always;
        add_header Access-Control-Allow-Origin $cs_cors_origin always;
        add_header Access-Control-Expose-Headers $cs_cors_expose always;
        add_header Vary Origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 503 '{"detail":"service_updating"}';
    }

    # --- Netdata monitoring dashboard (basic auth protected) ---
    location /netdata/ {
        auth_basic "Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd_netdata;

        proxy_pass $netdata_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
