services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible storage for dev/tests (SeaweedFS: server + bucket init in one
  # image, pulled without a registry login). Pinned by tag AND digest.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      # Capacity is bounded by free disk, not by config:
      # -volume.max=0 sizes the volume-slot count as free disk / volume size
      # (the default 8 slots x 1 GB capped writes at ~1 GB once the filer's
      # metadata log took its share). Growing one volume at a time (default 7)
      # keeps the metadata log (/topics, unnamed collection) at one slot, so on
      # a small disk it cannot take every slot before the bucket writes.
      # 1 GB volumes keep the slot count > 0 even with a few GB free.
      WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
    # On every start: write the S3 identity from S3_* (never AWS_*), start the
    # server, then create ${S3_BUCKET} if it is missing.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        weed server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 \
          -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json &
        pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        until echo "s3.bucket.list" | weed shell -master=127.0.0.1:9333 >/dev/null 2>&1; do sleep 1; done
        if ! echo "s3.bucket.list" | weed shell -master=127.0.0.1:9333 2>/dev/null | grep -qw "$$S3_BUCKET"; then
          echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=127.0.0.1:9333
        fi
        wait $$pid
    ports:
      - "9000:8333"   # S3 API
    volumes:
      - seaweedfs_data:/data
    # Healthy = S3 API answers AND the bucket exists (filer dir /buckets/<name>).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz && wget -q -O /dev/null http://127.0.0.1:8888/buckets/$$S3_BUCKET/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
