version: "v2_leaf"

# System prompt is loaded separately from v2_system.yaml.
# This file contains only the user prompt template for leaf nodes.

user_prompt_template: |
  ## Node Position: LEAF

  This is a **leaf node** — the lowest level of the hierarchy.
  It has no child nodes. All content comes from the materials below.

  This is where the most detailed, concrete analysis happens.
  Focus on extracting every concept, skill, and exercise from the
  materials with maximum specificity.

  ## Guidelines for Leaf Nodes

  - **Concepts**: Extract every distinct concept from the materials.
    For each concept, indicate the depth of coverage:
    - If the materials only mention or name the concept → brief definition
    - If the materials explain with examples → full definition + examples
    - If the materials show how to apply it → definition + examples +
      exercise suggestion
  - **core_concepts**: Only concepts that are **actually taught** in these
    materials (explained, demonstrated, practiced).
  - **mentioned_concepts**: Concepts that appear in passing (named but
    not explained). A mentor should know these are not taught here.
  - **Exercises**: Extract or derive exercises directly from the materials.
    Each exercise should be tied to specific concepts from the lessons.
  - **common_mistakes**: Be as specific as possible. Use both the
    materials AND your expertise as an experienced methodologist.
    Even if the materials don't mention a mistake explicitly, include
    it if it's a well-known pitfall for students learning this topic.
    Not "students struggle with this" but "students write `=` instead
    of `==` in conditions" or "students forget to close the file handle".
  - **Cross-references**: Every concept MUST have at least one reference
    back to the source material (timecode, slide number, or URL).
  - **summary_nested_nodes**: Return an empty string (leaf nodes have
    no children).
  - **Modules and lessons**: Split the materials into logical thematic
    blocks. Each module should be a self-contained topic. Within a module,
    order lessons so each builds on the previous one.

  ## Materials

  {context}

  ## Task

  Analyze the materials above and generate a CourseStructure that
  faithfully describes their content for a mentor.

  The mentor needs to know:
  1. What exactly is taught here — every concept, with its depth.
  2. What skills are practiced — every exercise and activity.
  3. What common mistakes to watch for when checking student work.
  4. How the material is organized — modules and lessons in logical order.

  Return ONLY valid JSON conforming to the CourseStructure schema.
