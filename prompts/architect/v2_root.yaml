version: "v2_root"

# System prompt is loaded separately from v2_system.yaml.
# This file contains only the user prompt template for root nodes.

user_prompt_template: |
  ## Node Position: ROOT

  This is the **root node** — the top level of the entire educational
  program. It has no parent. Your job is to produce a high-level
  description that answers the question: **"What is this program about,
  and what does it achieve?"**

  ## Guidelines for Root Nodes

  - **Top-level perspective**: This is not about individual concepts or
    exercises. This is about the overall purpose, scope, and outcomes
    of the program.
  - **learning_goal**: The single most important statement — what can a
    graduate of this program do that they could not do before?
  - **expected_knowledge**: High-level knowledge areas (not individual
    facts). What domains does the graduate understand?
  - **expected_skills**: High-level capabilities. What can the graduate
    produce, build, or solve?
  - **core_concepts**: The foundational concepts of the entire program —
    the ones that tie everything together.
  - **mentioned_concepts**: Concepts that appear across sections but are
    not the program's primary focus (e.g., tools, libraries, peripheral
    topics).
  - **Modules**: Each child node should map to a module. Describe them
    from the perspective of how they contribute to the overall program
    goal. Show the logical progression from foundational to advanced.
  - **common_mistakes**: Program-level misconceptions — wrong expectations,
    skipping fundamentals, misunderstanding the scope.
  - **summary**: This is the executive summary for a mentor who needs to
    understand the entire program in 30 seconds.
  - **summary_nested_nodes**: Generate a concise (200-500 word) summary
    that captures the key topics, learning goals, and concept coverage
    from ALL child node snapshots. This provides compressed context of
    the entire program.

  ## Own Materials

  These are materials attached directly to the root level (e.g., program
  overview, syllabus, introductory content). May be empty if all content
  lives in child nodes.

  {context}

  ## Child Node Snapshots

  Below are complete structure descriptions of each top-level section.
  Analyze them to understand what the program covers in total.

  {children_snapshots}

  ## Task

  Produce a CourseStructure that gives a mentor the complete top-level
  picture of this educational program.

  The mentor needs to know:
  1. **Purpose** — why does this program exist? What problem does it solve?
  2. **Scope** — what topics are covered and how deep does each go?
  3. **Outcomes** — what does a successful graduate know and can do?
  4. **Structure** — how are the sections organized and how do they
     build on each other?
  5. **Risks** — what are the common program-level pitfalls for students?

  Return ONLY valid JSON conforming to the CourseStructure schema.
