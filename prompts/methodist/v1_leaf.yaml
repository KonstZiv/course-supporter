version: "v1_methodist_leaf"

user_prompt_template: |
  ## Target Node

  - **Title:** {node_title}
  - **Description:** {node_description}
  - **Type:** {node_type}
  - **Position:** Leaf node (no children)

  {material_roles}

  ## Source Materials (Layer 2 Outlines)

  {context}

  ## Current Structure Metadata

  {structure_context}

  {parent_context}

  {sibling_context}

  ## Task

  Generate a complete MethodistNodeOutput for this **leaf** node.

  As a leaf node, this is where students directly engage with content.
  Focus on:
  1. Precise, measurable learning objectives
  2. Detailed concept definitions with relationships to other concepts
  3. Common misconceptions students encounter at this level
  4. Concrete assignment recommendations (at least one test + one practical task)
  5. Gaps: are all prerequisites covered by earlier nodes?
  6. Contradictions: does anything conflict with sibling or parent materials?

  Return ONLY valid JSON.
