version: "v1_methodist_root"

user_prompt_template: |
  ## Target Node

  - **Title:** {node_title}
  - **Description:** {node_description}
  - **Type:** {node_type} (course root)
  - **Position:** Root node

  {material_roles}

  ## Source Materials (Layer 2 Outlines)

  {context}

  ## Current Structure Metadata

  {structure_context}

  {children_context}

  ## Task

  Generate a complete MethodistNodeOutput for the **root** node (entire course).

  As the root node, you provide a course-wide methodological overview:
  1. Learning objectives for the entire course — what students achieve
     upon completion
  2. Key concepts: the most important concepts across all modules, with
     cross-module relationships
  3. Common misconceptions at the course level
  4. Assignment recommendations: suggest a final project or capstone
     assessment that integrates knowledge from all modules
  5. Gaps: does the course as a whole cover everything needed?
     Check for missing foundational topics, uncovered prerequisites,
     topics promised but not delivered.
  6. Contradictions: course-wide terminology consistency, ordering issues,
     difficulty progression problems
  7. Teaching recommendations: overall course pacing, suggested learning
     path, module ordering feedback
  8. Prerequisites: what should students know BEFORE starting this course?

  Return ONLY valid JSON.
